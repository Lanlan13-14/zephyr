<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>RDP Render WASM Smoke</title>
</head>
<body>
  <pre id="out">running</pre>
  <script type="module">
    const out = document.getElementById('out');
    try {
      const mod = await import('../public/vendor/rdp-render/rdp_render_wasm.js');
      await mod.default({ module_or_path: '../public/vendor/rdp-render/rdp_render_wasm_bg.wasm' });
      const c = new mod.FrameCompositor(4, 3);
      const ok = c.blit_tile(1, 1, 2, 1, new Uint8Array([10, 11, 12, 13, 20, 21, 22, 23]));
      const dirty = Array.from(c.take_dirty()).join(',');
      const rgba = Array.from(mod.bgra_to_rgba(new Uint8Array([1, 2, 3, 4]))).join(',');
      if (!ok || dirty !== '1,1,2,1' || rgba !== '3,2,1,4') throw new Error(`bad result ok=${ok} dirty=${dirty} rgba=${rgba}`);
      out.textContent = 'rdp-render-browser-smoke ok';
      out.dataset.ok = '1';
    } catch (err) {
      out.textContent = 'rdp-render-browser-smoke failed: ' + (err?.stack || err);
      out.dataset.ok = '0';
    }
  </script>
</body>
</html>

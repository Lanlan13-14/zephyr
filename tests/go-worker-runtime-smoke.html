<!doctype html><meta charset="utf-8"><title>Go Worker runtime smoke</title><pre id="out">running</pre><script type="module">
const worker = new Worker('./go-worker-runtime-smoke.js', { type: 'module' });
const result = await new Promise((resolve) => {
    const timeout = setTimeout(() => resolve({ ok: false, error: 'timeout' }), 10000);
    worker.onmessage = ({ data }) => { clearTimeout(timeout); resolve(data); };
    worker.onerror = (event) => { clearTimeout(timeout); resolve({ ok: false, error: event.message }); };
});
worker.terminate();
globalThis.goWorkerSmokeResult = result;
document.querySelector('#out').textContent = JSON.stringify(result);
</script>

<!doctype html><meta charset="utf-8"><title>Go Worker runtime smoke</title><pre id="out">running</pre><script type="module">
const worker = new Worker('./go-worker-runtime-smoke.js', { type: 'module' });
const keepAlive = setInterval(() => { document.body.dataset.workerWait = String(Date.now()); }, 25);
const timeout = setTimeout(() => finish({ ok:false, error:'timeout' }), 10000);
function finish(result) { clearInterval(keepAlive); clearTimeout(timeout); globalThis.goWorkerSmokeResult=result; document.querySelector('#out').textContent=JSON.stringify(result); worker.terminate(); }
worker.onmessage = ({data}) => finish(data);
worker.onerror = (event) => finish({ok:false,error:event.message});
</script>

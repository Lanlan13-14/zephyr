<!doctype html><meta charset="utf-8"><title>RDP renderer smoke</title>
<canvas id="c" width="8" height="8"></canvas><pre id="out">running</pre>
<script type="module">
import { RdpGpuSurfaceCompositor } from '../public/rdp-renderer.js';
const out = document.getElementById('out');
const fail = (msg) => { throw new Error(msg); };
try {
 const c = document.getElementById('c');
 let callback;
 const r = new RdpGpuSurfaceCompositor(c,{requestFrame:fn=>(callback=fn,1),cancelFrame(){}});
 r.reset(8,8); r.createSurface(1,8,8); r.mapSurface(1,0,0,8,8);

 // REAL contract: Go ClearCodec / RFX / classic OnBitmap emit top-down BGRA
 // (row 0 = visual top). Matches FreeRDP GDI surface storage.
 const bgra = new Uint8Array(8*8*4);
 const setRow=(row,px)=>{for(let x=0;x<8;x++)bgra.set(px,(row*8+x)*4);};
 setRow(0,[0,0,255,255]); // red = visual top
 setRow(1,[0,255,0,255]); // green
 setRow(6,[255,0,0,255]); // blue
 setRow(7,[255,255,255,255]); // white = visual bottom
 r.uploadBitmap(1,{left:0,top:0,right:8,bottom:8},bgra,32);

 // Partial upload at protocol rows 2..4: row 0 of payload = band top (magenta),
 // row 1 = band bottom (cyan).
 const part = new Uint8Array(4*2*4);
 for(let x=0;x<4;x++){part.set([255,0,255,255],x*4);part.set([255,255,0,255],16+x*4);}
 r.uploadBitmap(1,{left:0,top:2,right:4,bottom:4},part,16);

 // Cache protocol top-left 2x2 (red over green) into slot 2, paste at (6,6).
 r.cacheSurface(1,2,{left:0,top:0,right:2,bottom:2});
 r.drawCache(2,1,6,6);

 // Solid fill at protocol rows 4..6, cols 4..6.
 r.solidFill(1,{left:4,top:4,right:6,bottom:6},0xFFFF00FF); // magenta BGRA

 // Same-surface copy: copy paste region rows 6..8 cols 6..8 to rows 0..2 cols 4..6.
 r.copySurface(1,1,{left:6,top:6,right:8,bottom:8},4,0);
 // OOB same-surface copy: only (7,7) survives; source top-left is red.
 r.copySurface(1,1,{left:0,top:0,right:2,bottom:2},7,7);
 // Cross-surface copy.
 r.createSurface(2,8,8);
 r.copySurface(1,2,{left:0,top:0,right:8,bottom:8},0,0);

 r.beginFrame(1); r.endFrame(1); callback();

 const g = new Uint8Array(8*8*4);
 r.gl.readPixels(0,0,8,8,r.gl.RGBA,r.gl.UNSIGNED_BYTE,g);
 // readPixels row 0 = canvas bottom; at(x,y) uses visual top-down y.
 const at=(x,y)=>{const o=((7-y)*8+x)*4;return [g[o],g[o+1],g[o+2]];};
 const eq=(a,b)=>a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2];
 const RED=[255,0,0],GREEN=[0,255,0],BLUE=[0,0,255],WHITE=[255,255,255],CYAN=[0,255,255],MAG=[255,0,255];
 if(!eq(at(7,0),RED)) fail(`top row not red: ${at(7,0)}`);
 if(!eq(at(7,1),GREEN)) fail(`row1 not green: ${at(7,1)}`);
 if(!eq(at(5,6),BLUE)) fail(`row6 not blue: ${at(5,6)}`);
 if(!eq(at(5,7),WHITE)) fail(`bottom row not white: ${at(5,7)}`);
 if(!eq(at(0,2),MAG)) fail(`partial top row wrong: ${at(0,2)}`);
 if(!eq(at(0,3),CYAN)) fail(`partial bottom row wrong: ${at(0,3)}`);
 if(!eq(at(3,2),MAG)) fail(`partial right edge wrong: ${at(3,2)}`);
 if(!eq(at(6,6),RED)) fail(`cache paste top wrong: ${at(6,6)}`);
 if(!eq(at(7,6),RED)) fail(`cache paste top(2) wrong: ${at(7,6)}`);
 // (7,7) overwritten by OOB copy below — assert left neighbour only.
 if(!eq(at(6,7),GREEN)) fail(`cache paste bottom wrong: ${at(6,7)}`);
 if(!eq(at(4,4),MAG)) fail(`fill tl wrong: ${at(4,4)}`);
 if(!eq(at(5,5),MAG)) fail(`fill br wrong: ${at(5,5)}`);
 if(eq(at(3,4),MAG)) fail(`fill leaked left`);
 if(eq(at(6,4),MAG)) fail(`fill leaked right`);
 if(eq(at(4,6),MAG)) fail(`fill leaked below`);
 if(!eq(at(4,0),RED)) fail(`same-surface copy top wrong: ${at(4,0)}`);
 if(!eq(at(5,0),RED)) fail(`same-surface copy top(2) wrong: ${at(5,0)}`);
 if(!eq(at(4,1),GREEN)) fail(`same-surface copy bottom wrong: ${at(4,1)}`);
 if(!eq(at(5,1),GREEN)) fail(`same-surface copy bottom(2) wrong: ${at(5,1)}`);
 if(!eq(at(7,7),RED)) fail(`oob copy texel wrong: ${at(7,7)}`);
 if(!eq(at(6,7),GREEN)) fail(`oob copy clobbered left neighbour: ${at(6,7)}`);
 const s2 = r.surfaces.get(2);
 r.gl.bindFramebuffer(r.gl.READ_FRAMEBUFFER, s2.framebuffer);
 const g2 = new Uint8Array(8*8*4);
 r.gl.readPixels(0,0,8,8,r.gl.RGBA,r.gl.UNSIGNED_BYTE,g2);
 const at2=(x,y)=>{const o=((7-y)*8+x)*4;return [g2[o],g2[o+1],g2[o+2]];};
 if(!eq(at2(7,0),RED)) fail(`cross-surface copy top wrong: ${at2(7,0)}`);
 if(!eq(at2(5,7),WHITE)) fail(`cross-surface copy bottom wrong: ${at2(5,7)}`);
 if(!eq(at2(6,6),RED)) fail(`cross-surface copy cache region wrong: ${at2(6,6)}`);
 if(!eq(at2(4,4),MAG)) fail(`cross-surface copy fill region wrong: ${at2(4,4)}`);
 r.gl.bindFramebuffer(r.gl.READ_FRAMEBUFFER, null);

 window.result={ok:true,pixels:[...g],presents:r.presentedFrames};
 out.textContent=JSON.stringify(window.result);
} catch(e){window.result={ok:false,error:e.stack};out.textContent=JSON.stringify(window.result)}
</script>

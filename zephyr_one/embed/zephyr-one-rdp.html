<!DOCTYPE html>
<!--
  zephyr-one-rdp.html — Zephyr One's native RDP surface.

  This replaces the browser product's WASM RDP page, *inside Zephyr One only*.
  The browser product keeps its
  Go/WASM client; nothing here is served to it, because these files live in
  zephyr_one/embed/ and are copied into the staged core by
  scripts/stage-native-rdp.mjs.

  Why the WASM pipeline is gone here:
    One is a desktop app, so it can link the reference implementation
    (libfreerdp) instead of reimplementing the protocol in Go. That brings
    CredSSP/NLA, the full codec set, OS audio backends, and — the reason this
    work started — real RDPDR drive redirection, which is what makes folder
    mapping an actual mapped drive in the remote Explorer rather than a file
    list the page uploads.

  This page is deliberately thin: it paints damage rectangles onto a canvas and
  forwards input. All protocol work happens in the native helper process.
-->
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Zephyr One — 远程桌面</title>
<style>
    :root {
        --bg: #0b0f14;
        --panel: #141a22;
        --border: #232c38;
        --text: #e6edf3;
        --text-dim: #8b98a9;
        --accent: #4c8dff;
        --danger: #ff5f56;
    }
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    }
    #stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
    }
    /*
     * The canvas is sized in *device* pixels to match the remote desktop exactly
     * and then scaled by CSS. Scaling in CSS rather than drawing scaled keeps
     * putImageData one-to-one with the bytes the helper sent, so no resampling
     * happens on the hot path.
     */
    #screen {
        display: block;
        image-rendering: pixelated;
        touch-action: none;
        outline: none;
    }
    #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(11, 15, 20, 0.92);
        z-index: 10;
    }
    #overlay[hidden] { display: none; }
    .card {
        max-width: min(560px, 88vw);
        padding: 22px 24px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--panel);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
    }
    .card h2 {
        margin: 0 0 8px;
        font-size: 16px;
        font-weight: 600;
    }
    .card p {
        margin: 0 0 6px;
        color: var(--text-dim);
        white-space: pre-wrap;
        word-break: break-word;
    }
    .card p.err { color: var(--danger); }
    .card pre {
        margin: 10px 0 0;
        padding: 10px;
        max-height: 180px;
        overflow: auto;
        border-radius: 8px;
        background: #0b0f14;
        border: 1px solid var(--border);
        color: var(--text-dim);
        font-size: 12px;
        white-space: pre-wrap;
    }
    .row {
        display: flex;
        gap: 10px;
        margin-top: 16px;
        flex-wrap: wrap;
    }
    button {
        appearance: none;
        border: 1px solid var(--border);
        background: #1b2331;
        color: var(--text);
        border-radius: 9px;
        padding: 8px 16px;
        font: inherit;
        cursor: pointer;
    }
    button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
    }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .spinner {
        width: 18px;
        height: 18px;
        margin-right: 10px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        display: inline-block;
        vertical-align: -3px;
        animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
        .spinner { animation-duration: 0s; }
    }
    /* Off-screen input that carries the IME on touch devices. Not display:none —
     * a hidden input cannot be focused, so the soft keyboard would never open. */
    #ime {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        opacity: 0;
    }
</style>
</head>
<body>
<div id="stage">
    <canvas id="screen" width="1920" height="1080" tabindex="0"
            aria-label="远程桌面画面"></canvas>
</div>

<input id="ime" type="text" autocomplete="off" autocorrect="off"
       autocapitalize="off" spellcheck="false" aria-hidden="true" tabindex="-1">

<div id="overlay" role="status" aria-live="polite">
    <div class="card">
        <h2 id="ovTitle"><span class="spinner"></span>正在连接…</h2>
        <p id="ovBody">正在启动本机 FreeRDP 会话。</p>
        <pre id="ovDetail" hidden></pre>
        <div class="row" id="ovActions" hidden>
            <button type="button" class="primary" id="ovRetry">重新连接</button>
        </div>
    </div>
</div>

<script src="/zephyr-one-rdp.js"></script>
</body>
</html>

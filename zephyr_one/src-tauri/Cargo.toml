[package]
name = "zephyr-one"
version = "0.1.0"
description = "Zephyr One — native multi-platform client with integrated Agent"
authors = ["Zephyr"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "zephyr_one_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
base64 = "0.22"
once_cell = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

# Optional biometric / device credential unlock (desktop + mobile where supported)
# Android/iOS: uses platform authenticators; desktop may fall back to OS keychain prompt plugins.
# We keep a thin abstraction in auth/mod.rs so missing plugin does not break builds.

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# Mobile targets use the same command surface; biometric via platform channel stubs.

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# NEVER enable for store builds. Local debug only.
dev-system-unlock-bypass = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

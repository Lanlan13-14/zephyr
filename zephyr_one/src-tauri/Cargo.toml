[package]
name = "zephyr-one"
version = "0.1.0"
description = "Zephyr One — full Zephyr product in Tauri"
authors = ["Zephyr"]
edition = "2021"
# Locked dependency graph requires Cargo 1.88 or newer.
rust-version = "1.88"

[lib]
name = "zephyr_one_lib"
# Desktop-only: main.rs links this as a normal Rust library. `staticlib` existed
# for the iOS static link and `cdylib` for the Android JNI shared object; both
# targets are gone, and building them cost link time on every desktop build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png` is required by tauri::image::Image::from_bytes, which the runtime
# theme-icon switch uses. Without it that constructor is not compiled in and the
# call fails to resolve.
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
once_cell = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

# macOS OS unlock
[target.'cfg(target_os = "macos")'.dependencies]
localauthentication-rs = "0.1"

# Windows Hello
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Security_Credentials_UI",
  "Foundation",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# NEVER enable for store builds.
dev-system-unlock-bypass = []

[profile.release]
panic = "abort"
# Thin LTO preserves cross-crate optimization while avoiding full-LTO's long
# single-threaded linker tail. Extra units make ARM64 CI builds use the runner.
codegen-units = 8
lto = "thin"
opt-level = "s"
strip = true

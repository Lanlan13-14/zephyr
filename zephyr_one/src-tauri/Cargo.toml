[package]
name = "zephyr-one"
version = "0.1.0"
description = "Zephyr One — full Zephyr product in Tauri"
authors = ["Zephyr"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "zephyr_one_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
base64 = "0.22"
once_cell = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

# Mobile OS unlock (Android BiometricPrompt / iOS LocalAuthentication)
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2"

# Android: open single asset (zephyr-core.tar.gz) via NDK AAssetManager, then gunzip+tar
[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = "0.21"
flate2 = "1"
tar = "0.4"

# macOS OS unlock
[target.'cfg(target_os = "macos")'.dependencies]
localauthentication-rs = "0.1"

# Windows Hello
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Security_Credentials_UI",
  "Foundation",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# NEVER enable for store builds.
dev-system-unlock-bypass = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[package]
name = "zephyr-one"
version = "0.1.0"
description = "Zephyr One — full Zephyr product in Tauri"
authors = ["Zephyr"]
edition = "2021"
# Locked dependency graph requires Cargo 1.88 or newer.
rust-version = "1.88"

[lib]
name = "zephyr_one_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
base64 = "0.22"
once_cell = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

# Mobile OS unlock (Android BiometricPrompt / iOS LocalAuthentication)
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2"

# Android: stream the bundled CommonJS entry via NDK AAssetManager. Static UI
# files stay as ordinary APK assets and are read from base.apk on demand.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# macOS OS unlock
[target.'cfg(target_os = "macos")'.dependencies]
localauthentication-rs = "0.1"

# Windows Hello
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Security_Credentials_UI",
  "Foundation",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# NEVER enable for store builds.
dev-system-unlock-bypass = []

[profile.release]
panic = "abort"
# Thin LTO preserves cross-crate optimization while avoiding full-LTO's long
# single-threaded linker tail. Extra units make ARM64 CI builds use the runner.
codegen-units = 8
lto = "thin"
opt-level = "s"
strip = true

[package]
name = "zephyr-one"
version = "0.1.0"
description = "Zephyr One — full Zephyr product in Tauri"
authors = ["Zephyr"]
edition = "2021"
# Locked dependency graph requires Cargo 1.88 or newer.
rust-version = "1.88"

[lib]
name = "zephyr_one_lib"
# Desktop-only: main.rs links this as a normal Rust library. `staticlib` existed
# for the iOS static link and `cdylib` for the Android JNI shared object; both
# targets are gone, and building them cost link time on every desktop build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compile native/freerdp-core/zephyr_rdp.c in-tree. The shim touches ALIGN64
# FreeRDP structs, so it must see the same headers the local FreeRDP was built
# from; a prebuilt archive would silently disagree after an upgrade.
cc = "1.2"
# FreeRDP 3 discovery. Emits the cargo:rustc-link-lib lines, while build.rs
# requires the freerdp3, freerdp-client3, and winpr3 modules at version >= 3.
pkg-config = "0.3"

[dependencies]
# `image-png` is required by tauri::image::Image::from_bytes, which the runtime
# theme-icon switch uses. Without it that constructor is not compiled in and the
# call fails to resolve.
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
once_cell = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
zeroize = "1"
base64 = "0.22"
png = "0.18"

# macOS OS unlock
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
localauthentication-rs = "0.1"

# Linux native RDP presentation. These are the same small FFI crates already
# used transitively by Tauri's GTK stack, made explicit so the surface can own
# an X11/Cairo window without routing frames through GTK or the WebView.
[target.'cfg(target_os = "linux")'.dependencies]
cairo-sys-rs = { version = "0.18", features = ["xlib"] }
x11 = { version = "2.21", features = ["xlib"] }

# Windows Hello
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Security_Credentials_UI",
  "Foundation",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# NEVER enable for store builds.
dev-system-unlock-bypass = []

[profile.release]
panic = "abort"
# Thin LTO preserves cross-crate optimization while avoiding full-LTO's long
# single-threaded linker tail. Extra units make ARM64 CI builds use the runner.
codegen-units = 8
lto = "thin"
opt-level = "s"
strip = true

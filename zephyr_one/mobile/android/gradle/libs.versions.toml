# Pinned versions. Protocol engines stay unpinned until the M0 ADR spikes in
# FREEZE/zephyr one for mobile/NATIVE_ENGINE_DECISIONS.md sign off on a build manifest.
[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
composeBom = "2024.12.01"
composeCompiler = "1.5.15"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
fragment = "1.8.5"
navigationCompose = "2.8.5"
room = "2.6.1"
sqlite = "2.6.2"
sqlcipher = "4.17.0"
okhttp = "4.12.0"
kotlinxSerialization = "1.7.3"
kotlinxCoroutines = "1.9.0"
workManager = "2.10.0"
security = "1.1.0-alpha06"
biometric = "1.2.0-alpha05"
documentFile = "1.0.1"
junit = "4.13.2"
androidxTestJunit = "1.2.1"
espresso = "3.6.1"
turbine = "1.2.0"
sshj = "0.38.0"

[libraries]

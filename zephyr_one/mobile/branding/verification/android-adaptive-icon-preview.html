<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zephyr One Android adaptive icon verification</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef1f4; color: #17202a; font: 14px/1.4 system-ui, sans-serif; }
    main { width: min(920px, calc(100vw - 32px)); padding: 28px; background: #fff; border: 1px solid #d8dee5; border-radius: 8px; }
    h1 { margin: 0 0 20px; font-size: 20px; letter-spacing: 0; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
    figure { margin: 0; text-align: center; }
    svg { display: block; width: 100%; aspect-ratio: 1; }
    figcaption { margin-top: 8px; font-weight: 650; }
    p { margin: 20px 0 0; color: #4b5968; }
    code { color: #17202a; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Zephyr One Android adaptive icon verification</h1>
    <div class="grid">
      <figure><svg id="square" viewBox="0 0 108 108" aria-label="Square adaptive mask"></svg><figcaption>Square</figcaption></figure>
      <figure><svg id="circle" viewBox="0 0 108 108" aria-label="Circular adaptive mask"></svg><figcaption>Circle</figcaption></figure>
      <figure><svg id="safe" viewBox="0 0 108 108" aria-label="Android safe zone"></svg><figcaption>66dp safe zone</figcaption></figure>
    </div>
    <p>Outlined wordmark bounds after the Android foreground transform: <code>x 69.06-80.15dp</code>, <code>y 57.79-61.89dp</code>. Farthest corner: <code>27.32dp</code> from center, leaving <code>5.68dp</code> inside the 33dp safe-zone radius.</p>
  </main>
  <script>
    const wind = `
      <defs>
        <linearGradient id="g" x1="30" y1="30" x2="170" y2="170" gradientUnits="userSpaceOnUse"><stop stop-color="#eef2f7"/><stop offset=".58" stop-color="#a8b5c3"/><stop offset="1" stop-color="#6e7b88"/></linearGradient>
        <mask id="cut"><rect width="200" height="200" fill="white"/><ellipse cx="145" cy="115" rx="5" ry="4.8" fill="black"/></mask>
      </defs>
      <g transform="scale(.54) translate(30 30) scale(.7)">
        <path d="M45 65C85 45 135 55 160 80C130 80 95 95 75 125" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M50 75C90 75 125 90 145 115C115 135 75 155 40 135" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".85" mask="url(#cut)"/>
        <path d="M78 88C108 106 137 137 170 128" fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/>
        <path d="M144.95 120.88Q142.70 120.88 141.28 119.41Q139.85 117.95 139.85 115.59Q139.85 113.10 141.30 111.56Q142.74 110.02 145.12 110.02Q147.37 110.02 148.76 111.49Q150.15 112.97 150.15 115.38Q150.15 117.85 148.71 119.37Q147.27 120.88 144.95 120.88ZM145.05 112.06Q143.81 112.06 143.08 112.99Q142.34 113.93 142.34 115.46Q142.34 117.02 143.08 117.93Q143.81 118.84 145.00 118.84Q146.22 118.84 146.94 117.96Q147.66 117.07 147.66 115.51Q147.66 113.87 146.96 112.97Q146.26 112.06 145.05 112.06Z M160.62 120.70H158.31V116.53Q158.31 114.79 157.07 114.79Q156.46 114.79 156.08 115.25Q155.69 115.71 155.69 116.42V120.70H153.37V113.20H155.69V114.39H155.72Q156.55 113.02 158.13 113.02Q160.62 113.02 160.62 116.11Z M169.19 117.61H164.29Q164.41 119.24 166.35 119.24Q167.59 119.24 168.53 118.66V120.33Q167.49 120.88 165.83 120.88Q164.01 120.88 163.01 119.88Q162.00 118.87 162.00 117.07Q162.00 115.20 163.09 114.11Q164.17 113.02 165.75 113.02Q167.39 113.02 168.29 113.99Q169.19 114.97 169.19 116.64ZM167.04 116.19Q167.04 114.58 165.74 114.58Q165.18 114.58 164.77 115.04Q164.37 115.50 164.28 116.19Z" fill="#0a84ff" opacity=".9"/>
        <circle cx="75" cy="125" r="3" fill="#8e99a6" opacity=".8"/>
      </g>`;
    function draw(id, clip, safe) {
      const svg = document.getElementById(id);
      svg.innerHTML = `<defs><clipPath id="${id}-clip">${clip}</clipPath></defs><g clip-path="url(#${id}-clip)"><rect width="108" height="108" fill="#fff"/>${wind}</g>${safe ? '<circle cx="54" cy="54" r="33" fill="none" stroke="#198754" stroke-width="1" stroke-dasharray="3 2"/><rect x="69.06" y="57.79" width="11.09" height="4.10" fill="none" stroke="#d63384" stroke-width=".8"/>' : ''}`;
    }
    draw('square', '<rect width="108" height="108" rx="18"/>', false);
    draw('circle', '<circle cx="54" cy="54" r="54"/>', false);
    draw('safe', '<rect width="108" height="108" rx="18"/>', true);
  </script>
</body>
</html>

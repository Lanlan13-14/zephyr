name: GHCR Cleanup (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete package versions v1.1.502 and v1.1.503
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'zephyr-ssh'
          package-type: 'container'
          min-versions-to-keep: 0
          delete-only-tag-versions: 'v1.1.502,v1.1.503'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Re-point latest to v1.1.501
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools create \
            -t ghcr.io/${OWNER_LOWER}/zephyr-ssh:latest \
            ghcr.io/${OWNER_LOWER}/zephyr-ssh:v1.1.501

name: Zephyr One

on:
  push:
    branches: [main]
    paths:
      - 'zephyr_one/**'
      - 'public/**'
      - 'server.js'
      - 'one-client-manager.js'
      - 'file-agent-manager.js'
      - '.github/workflows/zephyr-one.yml'
  pull_request:
    branches: [main]
    paths:
      - 'zephyr_one/**'
      - '.github/workflows/zephyr-one.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. one-v0.1.2)'
        required: false
        default: ''
      validation_only:
        description: 'Build the desktop targets for validation without publishing a release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: zephyr_one

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zephyr_one/package.json
      - run: npm ci --ignore-scripts
      - run: npm run test:ci
      - run: npm run build
      - name: Stage Zephyr core
        run: |
          sh scripts/stage-zephyr-core.sh
          test -f zephyr-core/server.js
          test -d zephyr-core/public

  # ───────────── Release builds (workflow_dispatch + tag) ─────────────

  build-windows:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Stamp package version from release tag
        shell: bash
        run: python3 scripts/set-version.py "${{ github.event.inputs.tag }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WebView2 (usually preinstalled on windows-2022)
        shell: pwsh
        run: |
          Write-Host "WebView2 / MSVC toolchain assumed available on runner"
      - name: Install npm deps
        shell: pwsh
        run: npm install
      - name: Stage Zephyr core
        shell: bash
        run: sh scripts/stage-zephyr-core.sh
      - name: Bundle desktop Node runtime
        shell: pwsh
        run: node scripts/stage-desktop-runtime.mjs
      - name: Build frontend
        shell: pwsh
        run: npm run build
      - name: Tauri build Windows
        shell: pwsh
        # stage:core already done; avoid double npm install in pretauri
        run: npx tauri build
      - name: Collect Windows artifacts
        shell: bash
        run: |
          mkdir -p dist-out
          find src-tauri/target/release/bundle -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.zip' \) -print
          # NSIS / MSI typical paths
          cp -v src-tauri/target/release/bundle/msi/*.msi dist-out/ 2>/dev/null || true
          cp -v src-tauri/target/release/bundle/nsis/*.exe dist-out/ 2>/dev/null || true
          # portable: zip the main exe + deps if present
          if [ -f src-tauri/target/release/zephyr-one.exe ]; then
            (cd src-tauri/target/release && zip -r "$OLDPWD/dist-out/zephyr-one-windows-x64-${{ github.event.inputs.tag }}.zip" zephyr-one.exe *.dll resources 2>/dev/null) || \
            (cd src-tauri/target/release && 7z a "$OLDPWD/dist-out/zephyr-one-windows-x64-${{ github.event.inputs.tag }}.zip" zephyr-one.exe) || true
          fi
          ls -la dist-out || true
      # Path/unit checks that only compile on Windows (verbatim \\?\ stripping).
      - name: Cargo test Windows path helpers
        shell: pwsh
        working-directory: zephyr_one/src-tauri
        run: cargo test --release --lib -- --nocapture
      # Install (NSIS if present) + launch + healthz + 60s hold. Uploads diagnostics
      # on failure so empty logs / EISDIR / missing resources are visible.
      - name: Windows install and runtime smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows-smoke | Out-Null
          pwsh -File scripts/windows-install-smoke.ps1 -Root (Resolve-Path .) -OutDir (Resolve-Path dist-windows-smoke) -ReadyTimeoutSec 120 -HoldSec 60
      - name: Upload Windows smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-smoke
          path: zephyr_one/dist-windows-smoke/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: zephyr_one/dist-out/**
          if-no-files-found: warn

  build-macos:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.validation_only != 'true'
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stamp package version from release tag
        run: python3 scripts/set-version.py "${{ github.event.inputs.tag }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm install
      - run: sh scripts/stage-zephyr-core.sh
      - run: node scripts/stage-desktop-runtime.mjs
      - run: npm run build
      - name: Tauri build macOS
        run: npx tauri build
      - name: Collect macOS artifacts
        run: |
          mkdir -p dist-out
          find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.app' \) 2>/dev/null | head -50 || true
          find src-tauri/target -type d -name '*.app' 2>/dev/null | head -20 || true
          # DMG
          cp -v src-tauri/target/release/bundle/dmg/*.dmg dist-out/ 2>/dev/null || true
          # App bundle zip
          app_path=$(find src-tauri/target/release/bundle -maxdepth 3 -name '*.app' -type d | head -n 1 || true)
          if [ -n "$app_path" ]; then
            app_name=$(basename "$app_path")
            (cd "$(dirname "$app_path")" && zip -r "$OLDPWD/dist-out/zephyr-one-macos-${{ github.event.inputs.tag }}.zip" "$app_name")
          fi
          # rename dmg if generic
          for f in dist-out/*.dmg; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              zephyr-one-*) ;;
              *) mv "$f" "dist-out/zephyr-one-macos-${{ github.event.inputs.tag }}.dmg" 2>/dev/null || true ;;
            esac
          done
          ls -la dist-out || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: zephyr_one/dist-out/**
          if-no-files-found: warn

  build-linux:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.validation_only != 'true'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stamp package version from release tag
        run: python3 scripts/set-version.py "${{ github.event.inputs.tag }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps
        working-directory: .
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - run: npm install
      - run: npm run stage:core
      - run: node scripts/stage-desktop-runtime.mjs
      - run: npm run build
      - name: Tauri build Linux (deb+rpm; skip AppImage/linuxdeploy flakiness)
        run: |
          # Full compile always; AppImage's linuxdeploy often fails on GH runners.
          npx tauri build --bundles deb,rpm
          # Keep the raw binary as portable fallback
          mkdir -p dist-out
          if [ -f src-tauri/target/release/zephyr-one ]; then
            cp -v src-tauri/target/release/zephyr-one "dist-out/zephyr-one-linux-x64-${{ github.event.inputs.tag }}"
            chmod +x "dist-out/zephyr-one-linux-x64-${{ github.event.inputs.tag }}"
          fi
      - name: Collect Linux artifacts
        run: |
          mkdir -p dist-out
          find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -exec cp -v {} dist-out/ \; || true
          ls -la dist-out || true
          test "$(find dist-out -type f | wc -l)" -gt 0
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: zephyr_one/dist-out/**
          if-no-files-found: warn

  release:
    # Publish whatever desktop platforms succeeded; one failing OS must not
    # withhold the others. `test` is the only hard gate.
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.validation_only != 'true' && needs.test.result == 'success' }}
    needs: [test, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Pack all platforms
        working-directory: .
        run: |
          mkdir -p dist-one
          find release-artifacts -type f \( \
            -name '*.msi' -o -name '*.exe' -o -name '*.zip' -o \
            -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \
          \) -exec cp -v {} dist-one/ \; || true
          # Linux also ships a bare portable binary with no extension.
          find release-artifacts -type f -name 'zephyr-one-linux-x64-*' \
            -exec cp -v {} dist-one/ \; || true
          ls -la dist-one || true
          test "$(find dist-one -type f | wc -l)" -gt 0
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "Zephyr One ${{ github.event.inputs.tag }}"
          body: |
            ## Zephyr One ${{ github.event.inputs.tag }}

            Full Zephyr product embedded in Tauri (local core). Remote main is **data sync only**.

            ### Platforms
            | Platform | Artifact |
            |---|---|
            | Windows | MSI / NSIS / portable zip |
            | macOS | DMG / app zip |
            | Linux | deb / rpm / portable binary |

            Android and iOS are **not** part of Zephyr One. The Tauri mobile
            path has been removed from this repository: iOS cannot spawn the
            Node core at all, and Android needed a libnode.so + APK-asset
            pipeline not worth maintaining. Both platforms are being rebuilt as
            native clients (SwiftUI / Jetpack Compose) that sync with Zephyr
            main instead of embedding the core.

            ### Notes
            - Desktop core runs in-process on loopback only; no LAN exposure
            - Optional OS unlock (default off): real LocalAuthentication / Windows Hello
            - Does **not** replace Zephyr Agent (`com.zephyr.agent`)
          files: dist-one/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: false

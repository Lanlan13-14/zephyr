name: Zephyr One

on:
  push:
    branches: [main]
    paths:
      - 'zephyr_one/**'
      - 'public/**'
      - 'server.js'
      - 'one-client-manager.js'
      - 'file-agent-manager.js'
      - 'zephyr-one-link-sync.js'
      - 'zephyr-one-link-ui.js'
      - 'zephyr-one-embed-surface.js'
      - '.github/workflows/zephyr-one.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'zephyr_one/**'
      - 'public/**'
      - 'server.js'
      - 'one-client-manager.js'
      - 'file-agent-manager.js'
      - 'zephyr-one-link-sync.js'
      - 'zephyr-one-link-ui.js'
      - 'zephyr-one-embed-surface.js'
      - '.github/workflows/zephyr-one.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version (e.g. one-v0.1.20). Do not put the pre suffix here.'
        required: false
        default: 'one-v0.1.20'
      prerelease_label:
        description: 'Pre-release suffix appended to the tag (e.g. pre1). Leave empty for a stable release.'
        required: false
        default: 'pre1'
      validation_only:
        description: 'Build the desktop targets for validation without publishing a release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ZEPHYR_ONE_RELEASE_TAG: ${{ github.event.inputs.tag }}${{ github.event.inputs.prerelease_label }}

defaults:
  run:
    working-directory: zephyr_one

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zephyr_one/package.json
      - run: npm ci --ignore-scripts
      - run: npm run test:ci
      - run: npm run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: zephyr-link/go.sum
      - name: Stage Zephyr core and the desktop Node runtime
        run: |
          npm run stage:desktop
          test -f zephyr-core/server.js
          test -d zephyr-core/public
          test -f zephyr-core/public/rdp.html
          test -f zephyr-core/public/rdp-wasm-client.js
          test -d desktop-runtime
          test -f desktop-runtime/runtime.json
          test -f desktop-runtime/zephyr-link-embed

  build-windows:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.tag != '' || inputs.validation_only == true)
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Stamp package version from release version
        shell: bash
        run: python3 scripts/set-version.py "${{ github.event.inputs.tag }}${{ github.event.inputs.prerelease_label }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install npm deps
        shell: pwsh
        run: npm install
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: zephyr-link/go.sum
      - name: Stage Zephyr core
        shell: bash
        run: sh scripts/stage-zephyr-core.sh
      - name: Bundle desktop Node runtime
        shell: pwsh
        run: node scripts/stage-desktop-runtime.mjs
      - name: Build frontend
        shell: pwsh
        run: npm run build
      - name: Electron build Windows
        shell: pwsh
        run: npx electron-builder --win nsis portable zip --x64 --publish never
      - name: Collect Windows artifacts
        shell: bash
        run: |
          mkdir -p dist-out
          find release -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.msi' \) -print
          cp -v release/*.exe dist-out/ 2>/dev/null || true
          cp -v release/*.zip dist-out/ 2>/dev/null || true
          ls -la dist-out || true
          test -n "$(find dist-out -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$(find dist-out -maxdepth 1 -type f -name '*.zip' -print -quit)"
      - name: Windows install and runtime smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows-smoke | Out-Null
          pwsh -File scripts/windows-install-smoke.ps1 -Root (Resolve-Path .) -OutDir (Resolve-Path dist-windows-smoke) -ReadyTimeoutSec 240 -HoldSec 60
      - name: Upload Windows smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-smoke
          path: zephyr_one/dist-windows-smoke/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64
          path: zephyr_one/dist-out/**
          if-no-files-found: error

  build-macos:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.tag != '' || inputs.validation_only == true)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Stamp package version from release version
        run: python3 scripts/set-version.py "${{ github.event.inputs.tag }}${{ github.event.inputs.prerelease_label }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: zephyr-link/go.sum
      - run: sh scripts/stage-zephyr-core.sh
      - run: node scripts/stage-desktop-runtime.mjs
      - run: npm run build
      - name: Core runtime smoke (embedded boot + redirect loop guard)
        run: sh scripts/smoke-core.sh
      - name: Electron build macOS
        run: npx electron-builder --mac dmg zip --arm64 --publish never
      - name: Collect macOS artifacts
        run: |
          mkdir -p dist-out
          find release -type f \( -name '*.dmg' -o -name '*.zip' \) -exec cp -v {} dist-out/ \; || true
          ls -la dist-out || true
          test -n "$(find dist-out -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$(find dist-out -maxdepth 1 -type f -name '*.zip' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: zephyr_one/dist-out/**
          if-no-files-found: error

  build-linux:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.tag != '' || inputs.validation_only == true)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Stamp package version from release version
        run: python3 scripts/set-version.py "${{ github.event.inputs.tag }}${{ github.event.inputs.prerelease_label }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux packaging deps
        working-directory: .
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rpm fakeroot xvfb
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: zephyr-link/go.sum
      - run: npm install
      - run: npm run stage:core
      - run: node scripts/stage-desktop-runtime.mjs
      - run: npm run build
      - name: Core runtime smoke (embedded boot + redirect loop guard)
        run: sh scripts/smoke-core.sh
      - name: Electron build Linux
        run: npx electron-builder --linux deb rpm --x64 --publish never
      - name: Collect Linux artifacts
        run: |
          mkdir -p dist-out
          find release -type f \( -name '*.deb' -o -name '*.rpm' \) -exec cp -v {} dist-out/ \; || true
          ls -la dist-out || true
          test -n "$(find dist-out -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find dist-out -maxdepth 1 -type f -name '*.rpm' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: zephyr_one/dist-out/**
          if-no-files-found: error

  release:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.validation_only != 'true' && needs.test.result == 'success' && needs.build-windows.result == 'success' && needs.build-macos.result == 'success' && needs.build-linux.result == 'success' }}
    needs: [test, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    concurrency:
      group: zephyr-one-desktop-release-${{ github.event.inputs.tag }}${{ github.event.inputs.prerelease_label }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Replace target prerelease and tag
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ env.ZEPHYR_ONE_RELEASE_TAG }}
        run: |
          set -euo pipefail
          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            gh release delete "$TARGET_TAG" --cleanup-tag --yes
          elif git ls-remote --exit-code --tags origin "refs/tags/$TARGET_TAG" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TARGET_TAG"
          fi
      - name: Pack all platforms
        working-directory: .
        run: |
          set -eu
          mkdir -p dist-one
          require_one() {
            platform=$1
            pattern=$2
            count=$(find "release-artifacts/$platform" -type f -name "$pattern" | wc -l | tr -d ' ')
            test "$count" -eq 1 || {
              echo "ERROR: expected exactly one $pattern in $platform, found $count" >&2
              exit 1
            }
            find "release-artifacts/$platform" -type f -name "$pattern" -exec cp -v {} dist-one/ \;
          }
          count_exe=$(find release-artifacts/windows-x64 -type f -name '*.exe' | wc -l | tr -d ' ')
          test "$count_exe" -ge 1 || { echo "ERROR: expected Windows exe artifacts" >&2; exit 1; }
          find release-artifacts/windows-x64 -type f -name '*.exe' -exec cp -v {} dist-one/ \;
          require_one windows-x64 '*.zip'
          require_one macos-arm64 '*.dmg'
          require_one macos-arm64 '*.zip'
          require_one linux-x64 '*.deb'
          require_one linux-x64 '*.rpm'
          ls -la dist-one || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.ZEPHYR_ONE_RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "Zephyr One ${{ env.ZEPHYR_ONE_RELEASE_TAG }}"
          body: |
            ## Zephyr One ${{ env.ZEPHYR_ONE_RELEASE_TAG }}

            Full Zephyr product embedded in Electron (local core). Remote main is **data sync only**.

            ### Platforms
            | Platform | Artifact |
            |---|---|
            | Windows | NSIS / portable / zip |
            | macOS | DMG / app zip (arm64) |
            | Linux | deb / rpm |

            Android and iOS are **not** part of desktop Zephyr One. Both platforms
            are native clients (SwiftUI / Jetpack Compose) that sync with Zephyr
            main instead of embedding the core.

            ### Notes
            - Desktop core runs on loopback only; no LAN exposure
            - Optional OS unlock (default off): real LocalAuthentication / Windows Hello
            - RDP uses the same WASM client as Web Zephyr
            - File sync (Zephyr Link) matches Android One enrollment
            - Does **not** replace Zephyr Agent (`com.zephyr.agent`)
          files: dist-one/*
          draft: false
          prerelease: ${{ github.event.inputs.prerelease_label != '' }}
          fail_on_unmatched_files: true

name: Zephyr Agent

on:
  push:
    branches: [main]
    paths:
      - 'zephyr_agent/**'
      - '.github/workflows/agent.yml'
  pull_request:
    branches: [main]
    paths:
      - 'zephyr_agent/**'
      - '.github/workflows/agent.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. agent-v1.0.0)'
        required: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: zephyr_agent

jobs:
  # ───────────── CI: always run on push / PR / dispatch ─────────────
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

  # ───────────── Release builds: only on workflow_dispatch with tag ──
  build-android:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --org com.zephyr --project-name zephyr_agent --platforms android .

      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: zephyr_agent/build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: zephyr_agent/build/app/outputs/bundle/release/app-release.aab

  build-windows:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
    needs: analyze-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true

      - name: Generate Windows platform files
        run: flutter create --org com.zephyr --project-name zephyr_agent --platforms windows .

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "zephyr-agent-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: zephyr_agent/zephyr-agent-windows-x64.zip

  build-linux:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true

      - name: Install Linux build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
        working-directory: .

      - name: Generate Linux platform files
        run: flutter create --org com.zephyr --project-name zephyr_agent --platforms linux .

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Archive
        run: tar czf zephyr-agent-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: zephyr_agent/zephyr-agent-linux-x64.tar.gz

  build-macos:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true

      - name: Generate macOS platform files
        run: flutter create --org com.zephyr --project-name zephyr_agent --platforms macos .

      - run: flutter pub get
      - run: flutter build macos --release

      - name: Archive
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$OLDPWD/zephyr-agent-macos-universal.zip" "zephyr_agent.app"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: zephyr_agent/zephyr-agent-macos-universal.zip

  build-ios:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true

      - name: Generate iOS platform files
        run: flutter create --org com.zephyr --project-name zephyr_agent --platforms ios .

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - name: Archive
        run: |
          cd build/ios/iphoneos
          zip -r "$OLDPWD/zephyr-agent-ios-unsigned.zip" "Runner.app"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: zephyr_agent/zephyr-agent-ios-unsigned.zip

  # ───────────── Create GitHub Release ──────────────────────────────
  release:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
    needs: [build-android, build-windows, build-linux, build-macos, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Rename artifacts
        working-directory: release-artifacts
        run: |
          VERSION=${{ github.event.inputs.tag }}
          cp android-apk/app-release.apk "zephyr-agent-android-arm64-${VERSION}.apk" 2>/dev/null || true
          cp android-aab/app-release.aab "zephyr-agent-android-${VERSION}.aab" 2>/dev/null || true
          cp windows-x64/zephyr-agent-windows-x64.zip "zephyr-agent-windows-x64-${VERSION}.zip" 2>/dev/null || true
          cp linux-x64/zephyr-agent-linux-x64.tar.gz "zephyr-agent-linux-x64-${VERSION}.tar.gz" 2>/dev/null || true
          cp macos-universal/zephyr-agent-macos-universal.zip "zephyr-agent-macos-universal-${VERSION}.zip" 2>/dev/null || true
          cp ios-unsigned/zephyr-agent-ios-unsigned.zip "zephyr-agent-ios-${VERSION}-unsigned.zip" 2>/dev/null || true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "Zephyr Agent ${{ github.event.inputs.tag }}"
          body: |
            ## Zephyr Agent ${{ github.event.inputs.tag }}

            Cross-platform file sharing agent for Zephyr RDP drive redirection.

            ### Downloads
            | Platform | File |
            |---|---|
            | Android APK | `zephyr-agent-android-arm64-${{ github.event.inputs.tag }}.apk` |
            | Android AAB | `zephyr-agent-android-${{ github.event.inputs.tag }}.aab` |
            | Windows x64 | `zephyr-agent-windows-x64-${{ github.event.inputs.tag }}.zip` |
            | Linux x64 | `zephyr-agent-linux-x64-${{ github.event.inputs.tag }}.tar.gz` |
            | macOS | `zephyr-agent-macos-universal-${{ github.event.inputs.tag }}.zip` |
            | iOS (unsigned) | `zephyr-agent-ios-${{ github.event.inputs.tag }}-unsigned.zip` |
          draft: false
          prerelease: false
          files: |
            release-artifacts/zephyr-agent-*

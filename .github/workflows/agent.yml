name: Zephyr Agent

on:
  push:
    branches: [main]
    paths:
      - 'zephyr_agent/**'
      - '.github/workflows/agent.yml'
  pull_request:
    branches: [main]
    paths:
      - 'zephyr_agent/**'
      - '.github/workflows/agent.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. agent-v1.0.0)'
        required: false
        default: 'agent-v1.0.0'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: zephyr_agent

jobs:
  # ───────────── CI: always run on push / PR / dispatch ─────────────
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

  # ───────────── Release builds: only on workflow_dispatch with tag ──
  build-android:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --org com.zephyr --project-name zephyr_agent --platforms android .

      - name: Install Android SAF host code
        run: sh tool/prepare_android.sh

      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: zephyr_agent/build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: zephyr_agent/build/app/outputs/bundle/release/app-release.aab

  build-windows:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
    needs: analyze-and-test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows platform files
        run: flutter create --org com.zephyr --project-name zephyr_agent --platforms windows .

      - name: Install Windows app metadata
        run: pwsh tool/prepare_windows.ps1

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Archive portable zip
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "zephyr-agent-windows-x64.zip"

      - name: Build Windows installer exe
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ github.event.inputs.tag }}"
          $iss = @"
          [Setup]
          AppName=Zephyr Agent
          AppVersion=$version
          DefaultDirName={autopf}\Zephyr Agent
          DefaultGroupName=Zephyr Agent
          OutputDir=.
          OutputBaseFilename=zephyr-agent-windows-x64-$version-setup
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          [Icons]
          Name: "{group}\Zephyr Agent"; Filename: "{app}\zephyr_agent.exe"
          Name: "{commondesktop}\Zephyr Agent"; Filename: "{app}\zephyr_agent.exe"; Tasks: desktopicon
          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"
          "@
          Set-Content -Path installer.iss -Value $iss
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            zephyr_agent/zephyr-agent-windows-x64.zip
            zephyr_agent/zephyr-agent-windows-x64-*-setup.exe

  build-linux:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
        working-directory: .

      - name: Generate Linux platform files
        run: flutter create --org com.zephyr --project-name zephyr_agent --platforms linux .

      - name: Install Linux app metadata
        run: sh tool/prepare_linux.sh

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Archive
        run: tar czf zephyr-agent-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: zephyr_agent/zephyr-agent-linux-x64.tar.gz

  build-macos:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate macOS platform files
        run: flutter create --org com.zephyr --project-name zephyr_agent --platforms macos .

      - name: Install macOS app metadata
        run: sh tool/prepare_apple.sh macos

      - run: flutter pub get
      - run: flutter build macos --release

      - name: Archive macOS zip and dmg
        run: |
          app_path=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)
          app_name=$(basename "$app_path")
          cd build/macos/Build/Products/Release
          zip -r "$OLDPWD/zephyr-agent-macos-universal.zip" "$app_name"
          cd "$OLDPWD"
          hdiutil create -volname "Zephyr Agent" -srcfolder "$app_path" -ov -format UDZO zephyr-agent-macos-universal.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            zephyr_agent/zephyr-agent-macos-universal.zip
            zephyr_agent/zephyr-agent-macos-universal.dmg

  build-ios:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS platform files
        run: flutter create --org com.zephyr --project-name zephyr_agent --platforms ios .

      - name: Install iOS app metadata
        run: sh tool/prepare_apple.sh ios

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - name: Archive iOS zip and ipa
        run: |
          cd build/ios/iphoneos
          zip -r "$OLDPWD/zephyr-agent-ios-unsigned.zip" "Runner.app"
          rm -rf Payload
          mkdir Payload
          cp -R Runner.app Payload/Runner.app
          zip -r "$OLDPWD/zephyr-agent-ios-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: |
            zephyr_agent/zephyr-agent-ios-unsigned.zip
            zephyr_agent/zephyr-agent-ios-unsigned.ipa

  # ───────────── Create GitHub Release ──────────────────────────────
  release:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
    needs: [build-android, build-windows, build-linux, build-macos, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Rename artifacts
        working-directory: release-artifacts
        run: |
          VERSION=${{ github.event.inputs.tag }}
          cp android-apk/app-release.apk "zephyr-agent-android-arm64-${VERSION}.apk" 2>/dev/null || true
          cp android-aab/app-release.aab "zephyr-agent-android-${VERSION}.aab" 2>/dev/null || true
          cp windows-x64/zephyr-agent-windows-x64.zip "zephyr-agent-windows-x64-${VERSION}.zip" 2>/dev/null || true
          cp windows-x64/zephyr-agent-windows-x64-*-setup.exe "zephyr-agent-windows-x64-${VERSION}-setup.exe" 2>/dev/null || true
          cp linux-x64/zephyr-agent-linux-x64.tar.gz "zephyr-agent-linux-x64-${VERSION}.tar.gz" 2>/dev/null || true
          cp macos-universal/zephyr-agent-macos-universal.zip "zephyr-agent-macos-universal-${VERSION}.zip" 2>/dev/null || true
          cp macos-universal/zephyr-agent-macos-universal.dmg "zephyr-agent-macos-universal-${VERSION}.dmg" 2>/dev/null || true
          cp ios-unsigned/zephyr-agent-ios-unsigned.zip "zephyr-agent-ios-${VERSION}-unsigned.zip" 2>/dev/null || true
          cp ios-unsigned/zephyr-agent-ios-unsigned.ipa "zephyr-agent-ios-${VERSION}-unsigned.ipa" 2>/dev/null || true

      - name: Generate changelog
        working-directory: .
        run: |
          git fetch --tags
          CURRENT_TAG="${{ github.event.inputs.tag }}"
          PREV_TAG=$(git tag --sort=-creatordate | grep '^agent-' | grep -v "^${CURRENT_TAG}$" | head -n 1)
          {
            echo "RELEASE_BODY<<EOF"
            echo "## Zephyr Agent ${CURRENT_TAG}"
            echo ""
            echo "Cross-platform file sharing agent for Zephyr RDP drive redirection."
            echo ""
            echo "### Downloads"
            echo "| Platform | File |"
            echo "|---|---|"
            echo "| Android APK | \`zephyr-agent-android-arm64-${CURRENT_TAG}.apk\` |"
            echo "| Android AAB | \`zephyr-agent-android-${CURRENT_TAG}.aab\` |"
            echo "| Windows installer | \`zephyr-agent-windows-x64-${CURRENT_TAG}-setup.exe\` |"
            echo "| Windows portable | \`zephyr-agent-windows-x64-${CURRENT_TAG}.zip\` |"
            echo "| Linux x64 | \`zephyr-agent-linux-x64-${CURRENT_TAG}.tar.gz\` |"
            echo "| macOS DMG | \`zephyr-agent-macos-universal-${CURRENT_TAG}.dmg\` |"
            echo "| macOS zip | \`zephyr-agent-macos-universal-${CURRENT_TAG}.zip\` |"
            echo "| iOS unsigned IPA | \`zephyr-agent-ios-${CURRENT_TAG}-unsigned.ipa\` |"
            echo "| iOS unsigned zip | \`zephyr-agent-ios-${CURRENT_TAG}-unsigned.zip\` |"
            echo ""
            if [ -z "$PREV_TAG" ]; then
              echo "## 🚀 初始版本"
              echo ""
              git log --pretty=format:"- %s (%h)"
            else
              echo "## 🚀 更新内容"
              echo ""
              echo "**对比**: \`$PREV_TAG\` → \`$CURRENT_TAG\`"
              echo ""
              git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)"
            fi
            echo ""
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "Zephyr Agent ${{ github.event.inputs.tag }}"
          body: ${{ env.RELEASE_BODY }}
          draft: false
          prerelease: false
          files: |
            release-artifacts/zephyr-agent-*

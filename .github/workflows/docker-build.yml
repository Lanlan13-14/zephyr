name: Build Zephyr-SSH Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set image names
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          VERSION_TAG=${{ github.event.inputs.tag }}
          echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_ENV
          echo "IMAGE_TAG=ghcr.io/${OWNER_LOWER}/zephyr-ssh:${VERSION_TAG}" >> $GITHUB_ENV
          echo "IMAGE_LATEST=ghcr.io/${OWNER_LOWER}/zephyr-ssh:latest" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve latest Agent release tag
        id: agent_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Prefer the newest agent-* tag so Docker release notes and the
          # image-baked public/agent-release.json stay in sync.
          AGENT_TAG=$(gh api "repos/${{ github.repository }}/releases" --jq '[.[] | select(.draft==false and (.tag_name|startswith("agent-")))] | sort_by(.published_at) | reverse | .[0].tag_name // empty' 2>/dev/null || true)
          if [ -z "$AGENT_TAG" ]; then
            AGENT_TAG=$(git tag --sort=-creatordate | grep '^agent-' | head -n 1 || true)
          fi
          echo "AGENT_TAG=${AGENT_TAG}" >> "$GITHUB_ENV"
          echo "tag=${AGENT_TAG}" >> "$GITHUB_OUTPUT"
          if [ -n "$AGENT_TAG" ]; then
            echo "url=https://github.com/${{ github.repository }}/releases/tag/${AGENT_TAG}" >> "$GITHUB_OUTPUT"
            echo "Resolved Agent release: ${AGENT_TAG}"
          else
            echo "url=https://github.com/${{ github.repository }}/releases" >> "$GITHUB_OUTPUT"
            echo "No agent-* release found yet"
          fi

      - name: Build Docker image
        run: |
          docker build \
            --build-arg ZEPHYR_VERSION="${VERSION_TAG}" \
            --build-arg GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            --build-arg GITHUB_REPOSITORY="${{ github.repository }}" \
            --build-arg ZEPHYR_AGENT_RELEASE_TAG="${AGENT_TAG}" \
            -t $IMAGE_TAG -t $IMAGE_LATEST .

      - name: Push Docker image
        run: |
          docker push $IMAGE_TAG
          docker push $IMAGE_LATEST

      - name: Generate changelog
        run: |
          git fetch --tags

          CURRENT_TAG=${{ env.VERSION_TAG }}

          # Docker tags are v*; Agent tags are agent-v*. Never mix them when
          # computing the previous Docker release for the changelog.
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)

          {
            echo "CHANGELOG<<EOF"
            echo ""
            if [ -z "$PREV_TAG" ]; then
              echo "## 🚀 初始版本"
              echo ""
              git log --pretty=format:"- %s (%h)"
            else
              echo "## 🚀 更新内容"
              echo ""
              echo "**对比**: \`$PREV_TAG\` → \`$CURRENT_TAG\`"
              echo ""
              git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)"
            fi
            echo ""
            echo "## Zephyr Agent"
            echo ""
            if [ -n "${AGENT_TAG}" ]; then
              echo "本镜像绑定的最新 Agent Release：[\`${AGENT_TAG}\`](https://github.com/${{ github.repository }}/releases/tag/${AGENT_TAG})"
              echo ""
              echo "App 内「设置 → 关于 / Zephyr Agent」也指向同一链接，无需再在 Docker \`v*\` 与 Agent \`agent-v*\` 页面来回切换。"
            else
              echo "尚未找到 \`agent-*\` Release；发布 Agent 后重新构建镜像即可自动写入下载链接。"
            fi
            echo ""
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "Zephyr-SSH ${{ env.VERSION_TAG }}"
          body: ${{ env.CHANGELOG }}
          draft: false
          prerelease: false
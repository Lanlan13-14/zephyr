name: Zephyr One Mobile

# The 46k+ lines of Kotlin under zephyr_one/mobile/android had never been
# compiled once, because no workflow referenced the tree and there is no Gradle
# wrapper in the repository. That is how four unresolved symbols
# (ZephyrOneRoot / AccountContainer / ZephyrApplication /
# SecretStore.SecretScope) survived in the :app module: every library module's
# unit tests can pass while the application module does not link.
#
# This workflow closes that gap in two independent layers:
#   1. `contracts` runs the Node contract suite, including the static
#      symbol-resolution test, and needs no Android SDK. It is fast and it is
#      what catches an unresolved reference in a reviewable way.
#   2. `android` is the real compiler. Static resolution cannot prove a call
#      site type-checks, so kotlinc has the final word.
#   3. `ios` is the same argument for Swift. mobile/ios had no Package.swift at
#      all, so its six generated files could not be compiled even in principle:
#      codegen was free to emit Swift that does not build and nothing would
#      notice. swift-symbols.test.mjs is the cheap static gate; swiftc on a
#      macOS runner is the one that actually type-checks.

on:
  push:
    branches: [main]
    paths:
      - 'zephyr_one/mobile/**'
      - 'zephyr-ai/**'
      - 'zephyr-link/**'
      - '.github/workflows/zephyr-one-mobile.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'zephyr_one/mobile/**'
      - 'zephyr-ai/**'
      - 'zephyr-link/**'
      - '.github/workflows/zephyr-one-mobile.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. zom-v1.0.0)'
        required: false
        default: 'zom-v1.0.0'
      prerelease_label:
        description: 'Pre-release suffix appended to the tag (e.g. pre1). Leave empty for a stable release.'
        required: false
        default: 'pre1'
      validation_only:
        description: 'Build and test both platforms without publishing a release'
        type: boolean
        required: false
        default: false

concurrency:
  group: zephyr-one-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zephyr_one/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      # The mobile suite is no longer stdlib-only, and the comment that said it was
      # is why this job had never passed. Four suites (mobile-v1-api,
      # mobile-v1-roundtrip, mobile-v1-secrets, mobile-v1-shared) spawn the real
      # `node server.js` from the repo root to drive /api/mobile/v1 over HTTP, and
      # three import @noble/post-quantum and ws directly. Without an install those
      # 67 tests fail here and nowhere else, because a developer machine already has
      # node_modules from working on the server.
      #
      # --ignore-scripts keeps the native addons (better-sqlite3, sharp, ssh2) from
      # building, which this job does not need: every server-spawning suite sets
      # ZEPHYR_ONE_USE_BUILTIN_SQLITE=1 for exactly that reason.
      - name: Install server dependencies
        working-directory: .
        run: npm ci --ignore-scripts
      - name: Verify public diagnostic sanitizer
        run: node "$GITHUB_WORKSPACE/.github/scripts/annotate-mobile-contract-failure.test.mjs"
      - name: Contract drift and contract tests
        shell: bash
        run: |
          set -o pipefail
          status=0
          npm test 2>&1 | tee /tmp/mobile-contracts.log || status=$?
          if [ "$status" -ne 0 ]; then
            node "$GITHUB_WORKSPACE/.github/scripts/annotate-mobile-contract-failure.mjs" \
              --log /tmp/mobile-contracts.log \
              --exit "$status" \
              --platform "${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown}" || \
              echo '::error title=Zephyr One mobile contracts::Contract suite failed; sanitized diagnostics were unavailable.'
            exit "$status"
          fi

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zephyr_one/mobile/android
    steps:
      - uses: actions/checkout@v5
        with:
          # The AI-runtime freshness gate resolves the tree hash of the commit the committed
          # binary was built from, so it needs that commit object, not just HEAD.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          # JVM 17: buildSrc pins ZephyrBuild.JAVA_VERSION to 17 and every
          # module sets jvmTarget 17, so a newer default JDK would compile the
          # modules against a toolchain the build scripts do not describe.
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # compileSdk 35 per buildSrc/ZephyrBuild.kt. NDK is required to
          # package libzephyr_rdp_android.so into the installable APK.
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Install FreeRDP Android build tools
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache Android FreeRDP
        uses: actions/cache@v4
        with:
          path: zephyr_one/native/freerdp-core/.freerdp-android
          key: android-freerdp-3.30.0-cliprdr-v1-${{ hashFiles('zephyr_one/native/freerdp-core/scripts/build-freerdp-android.sh', 'zephyr_one/native/freerdp-core/patches/**') }}

      - name: Build pinned Android FreeRDP
        working-directory: .
        env:
          ZEPHYR_ANDROID_FREERDP_ROOT: ${{ github.workspace }}/zephyr_one/native/freerdp-core/.freerdp-android
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          export ANDROID_NDK_HOME="$sdk/ndk/27.2.12479018"
          test -d "$ANDROID_NDK_HOME"
          sh zephyr_one/native/freerdp-core/scripts/build-freerdp-android.sh arm64-v8a
          test -f "$ZEPHYR_ANDROID_FREERDP_ROOT/arm64-v8a/.zephyr-freerdp-tag"
          test "$(cat "$ZEPHYR_ANDROID_FREERDP_ROOT/arm64-v8a/.zephyr-freerdp-tag")" = '3.30.0+cliprdr-reassembly-limit-v1+tlsalloc-bionic-v1+ntlm-internal-crypto-v1'
          grep -q '^#define WITH_INTERNAL_MD4' "$ZEPHYR_ANDROID_FREERDP_ROOT/arm64-v8a/include/winpr3/winpr/config.h"
          grep -q '^#define WITH_INTERNAL_RC4' "$ZEPHYR_ANDROID_FREERDP_ROOT/arm64-v8a/include/winpr3/winpr/config.h"
          grep -q '^#define WITH_INTERNAL_MD5' "$ZEPHYR_ANDROID_FREERDP_ROOT/arm64-v8a/include/winpr3/winpr/config.h"

      # Gradle is provisioned by the action rather than by a committed wrapper.
      # The wrapper JAR is a binary artefact, and adding one that no human in
      # this repository has run is worse than declaring the version here where
      # it is reviewable in plain text. AGP 8.7.3 requires Gradle 8.9+.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # The embedded AI runtime is a real Go binary committed under jniLibs. For months it was a
      # stale build from a single commit and CI never rebuilt it, so every Kotlin/Go contract fix
      # silently shipped nothing. Build the artifact from the pinned zephyr-ai source here and
      # compare it byte-for-byte with the committed copy: any source/binary drift fails the build
      # instead of shipping a dead AI feature. The committed copy must be refreshed with the exact
      # command documented in zephyr-ai/android-build-contract.go.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.9'
      - name: Rebuild embedded Go runtimes and verify they are current
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          # Each embedded Go runtime is a real binary committed under jniLibs. They were once a
          # stale build CI never rebuilt, so every later fix silently shipped nothing. For each
          # module: rebuild from the pinned source, then verify the committed binary's embedded
          # vcs.revision resolves to the same source tree as HEAD (tree-hash compare, so no
          # cross-environment reproducibility assumption). Drift fails the build.
          check_runtime() {
            local module="$1" entry="$2" soname="$3"
            local so="zephyr_one/mobile/android/app/src/main/jniLibs/arm64-v8a/${soname}"
            test -f "$so" || { echo "::error::missing ${so}"; exit 1; }
            local tmp; tmp="$(mktemp -u).so"
            (cd "$module" && CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
              go build -trimpath -ldflags='-s -w' -o "$tmp" "$entry")
            test -s "$tmp"; rm -f "$tmp"
            local committed_rev committed_mod
            committed_rev="$(go version -m "$so" | sed -n 's/.*vcs.revision=\([0-9a-f]*\).*/\1/p')"
            committed_mod="$(go version -m "$so" | sed -n 's/.*vcs.modified=\([a-z]*\).*/\1/p')"
            echo "${soname}: revision=$committed_rev modified=$committed_mod"
            test -n "$committed_rev" || { echo "::error::${soname} carries no vcs.revision"; exit 1; }
            test "$committed_mod" = "false" || { echo "::error::${soname} built from a dirty tree"; exit 1; }
            git cat-file -e "$committed_rev^{commit}" 2>/dev/null || git fetch -q --depth 1 origin "$committed_rev"
            local head_tree so_tree
            head_tree="$(git rev-parse "HEAD:${module}")"
            so_tree="$(git rev-parse "${committed_rev}:${module}")"
            test "$head_tree" = "$so_tree" || {
              echo "::error::${soname} built from ${module}@$committed_rev (tree $so_tree) != HEAD tree $head_tree"
              echo "Rebuild: (cd ${module} && CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o ../${so} ${entry}) and commit."
              exit 1
            }
          }
          check_runtime zephyr-ai ./cmd/zephyr-ai-android libzephyr_ai_runtime.so
          check_runtime zephyr-link ./cmd/zephyr-link-android libzephyr_link.so

      # Keep the Gradle daemon between these two steps (setup-gradle starts it).
      # Do not merge assemble + tests into one invocation: the combined command
      # sat on `:app:assemblePrerelease` with no further task lines because tee
      # buffered the whole stream. Split the steps so GitHub shows progress, and
      # force line-buffered stdout so kotlinc / test output appears live.
      #
      # assemblePrerelease already compiled every library as release. Reuse those
      # classes for library unit tests (`testReleaseUnitTest`) and run the app
      # tests against the prerelease variant. Skip :app:testReleaseUnitTest so we
      # do not compile a third :app variant. Never run testDebugUnitTest — that
      # recompiles the tree as debug and is what made "Unit tests" look hung.
      - name: Compile the application module
        timeout-minutes: 15
        env:
          ZEPHYR_ANDROID_FREERDP_ROOT: ${{ github.workspace }}/zephyr_one/native/freerdp-core/.freerdp-android
          PYTHONUNBUFFERED: '1'
        shell: bash
        working-directory: zephyr_one/mobile/android
        run: |
          set -o pipefail
          status=0
          stdbuf -oL -eL gradle --stacktrace --console=plain :app:assemblePrerelease \
            2>&1 | stdbuf -oL -eL tee /tmp/gradle-assemble.log || status=$?
          if [ "$status" -ne 0 ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/annotate-build-failure.sh" \
              /tmp/gradle-assemble.log 'gradle :app:assemblePrerelease'
            exit "$status"
          fi

      # Run test tasks serially inside one warm Gradle invocation. With project parallelism enabled,
      # core-ui could fail while feature-sessions had already entered a leaked coroutine; Gradle then
      # waited for the leak and hid the useful assertion behind the job timeout. --no-parallel makes
      # the first failed module stop the graph. The root build gives every Test task its own 90-second
      # deadline and failFast=true, so a future leak is named and cancelled by Gradle itself.
      - name: Unit tests
        timeout-minutes: 6
        env:
          ZEPHYR_ANDROID_FREERDP_ROOT: ${{ github.workspace }}/zephyr_one/native/freerdp-core/.freerdp-android
        shell: bash
        working-directory: zephyr_one/mobile/android
        run: |
          set -o pipefail
          status=0
          stdbuf -oL -eL gradle --stacktrace --console=plain --no-parallel --max-workers=2 \
            -Pzephyr.unitTestTimeoutSeconds=90 \
            testReleaseUnitTest \
            -x :app:testReleaseUnitTest \
            :app:testPrereleaseUnitTest \
            :core-contracts:test \
            :core-model:test \
            :protocol-telnet:test \
            :protocol-zft2:test \
            2>&1 | stdbuf -oL -eL tee /tmp/gradle-test.log || status=$?
          if [ "$status" -ne 0 ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/annotate-build-failure.sh" \
              /tmp/gradle-test.log 'gradle unit tests'
            exit "$status"
          fi

      - name: Validate installable APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/prerelease/*.apk)
          test "${#apks[@]}" -eq 1
          unzip -tq "${apks[0]}"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "${apks[0]}"
          version="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "${apks[0]}" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          test "$version" = '1.0.0'
          package="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "${apks[0]}" | sed -n "s/package: name='\([^']*\)'.*/\1/p")"
          test "$package" = 'one.zephyr.mobile.debug'
          ! $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "${apks[0]}" | grep -q '^application-debuggable$'
          unzip -Z1 "${apks[0]}" | grep -qx 'lib/arm64-v8a/libzephyr_rdp_android.so'
          # The embedded Go runtimes must actually ship, or the AI/Link features are dead on device.
          unzip -Z1 "${apks[0]}" | grep -qx 'lib/arm64-v8a/libzephyr_ai_runtime.so'
          unzip -Z1 "${apks[0]}" | grep -qx 'lib/arm64-v8a/libzephyr_link.so'
          fragment_version="$(unzip -p "${apks[0]}" META-INF/androidx.fragment_fragment.version)"
          test "$fragment_version" = '1.8.5'
          # Runtime SSH gate, not a source-level promise. pre21 retained the external
          # BouncyCastleProvider under Android's existing "BC" provider name and made every SSH
          # transport fail before authentication. OpenSSH v1 must remain, the conflicting provider
          # must not be in the optimized APK.
          dex_dir="$(mktemp -d)"
          unzip -q "${apks[0]}" 'classes*.dex' -d "$dex_dir"
          grep -aFq 'Lcom/hierynomus/sshj/userauth/keyprovider/OpenSSHKeyV1KeyFile;' "$dex_dir"/classes*.dex
          if grep -aFq 'Lorg/bouncycastle/jce/provider/BouncyCastleProvider;' "$dex_dir"/classes*.dex; then
            echo 'external BouncyCastleProvider must not ship in the Android APK' >&2
            exit 1
          fi
          grep -aFq 'Lnet/i2p/crypto/eddsa/EdDSAPublicKey;' "$dex_dir"/classes*.dex
          rm -rf "$dex_dir"

      # assemblePrerelease is signed with the committed pre-release PKCS12, not the
      # per-runner debug.keystore. That is what lets successive pre-releases
      # update each other. Upload the APK so a green run yields a testable
      # build and the release job has something to attach.
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-prerelease-apk
          path: zephyr_one/mobile/android/app/build/outputs/apk/prerelease/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            zephyr_one/mobile/android/**/build/reports/tests/**
            zephyr_one/mobile/android/**/build/test-results/**
          if-no-files-found: warn

  ios:
    # macOS is the only runner with a Swift toolchain and the iOS SDK. The
    # contracts job already ran the static gate on ubuntu, so this job exists
    # purely to run a compiler over the same tree -- which is the step no
    # amount of source scanning can replace.
    runs-on: macos-14
    defaults:
      run:
        working-directory: zephyr_one/mobile/ios
    steps:
      - uses: actions/checkout@v5

      # Compile before test, for the same reason the Android job does: a target
      # that does not build cannot report a meaningful test result.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          status=0
          swift build -v 2>&1 | tee /tmp/swift-build.log || status=$?
          if [ "$status" -ne 0 ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/annotate-build-failure.sh" \
              /tmp/swift-build.log 'swift build'
            exit "$status"
          fi

      # The suites read mobile/contracts/generated/*.json through #filePath, so
      # they exercise the same frozen vectors the Kotlin and Node suites do. A
      # path regression here fails at runtime and only on this runner, which is
      # exactly why the static gate pins the directory walk as well.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          status=0
          swift test -v 2>&1 | tee /tmp/swift-test.log || status=$?
          if [ "$status" -ne 0 ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/annotate-build-failure.sh" \
              /tmp/swift-test.log 'swift test'
            exit "$status"
          fi

      # Build a device-targeted Swift executable against the checked-in
      # ZephyrUI package, place it in a valid .app bundle, and archive that
      # bundle as an unsigned IPA. The packager rejects host executables and
      # malformed Payload layouts rather than relabelling arbitrary output.
      - name: Build unsigned IPA
        shell: bash
        env:
          # Dispatch versions are release tags (zom-v1.0.0); the packager
          # removes the required prefix for CFBundleShortVersionString. Push
          # and pull-request validation runs use a valid standalone default.
          MARKETING_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '1.0.0' }}
        run: |
          set -o pipefail
          set +e
          bash "$GITHUB_WORKSPACE/zephyr_one/mobile/tools/package-ios-unsigned.sh" \
            "$GITHUB_WORKSPACE/zephyr_one/mobile/build/zephyr-one-ios-unsigned.ipa" \
            "$GITHUB_WORKSPACE/zephyr_one/mobile/ios" \
            2>&1 | tee /tmp/ios-package.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/annotate-build-failure.sh" \
              /tmp/ios-package.log 'package unsigned iOS app'
            exit "$status"
          fi
          ipa="$GITHUB_WORKSPACE/zephyr_one/mobile/build/zephyr-one-ios-unsigned.ipa"
          if [ ! -s "$ipa" ]; then
            {
              echo 'Packager log tail:'
              tail -n 70 /tmp/ios-package.log
              echo "Expected non-empty IPA at: $ipa"
              echo 'Packager stage markers:'
              grep -E '^(IPA_STAGE=|Created unsigned IPA:|package-ios-unsigned failed)' \
                /tmp/ios-package.log || true
              echo 'Expected output directory:'
              ls -la "$(dirname "$ipa")" 2>&1 || true
              echo 'IPA files found under the workspace:'
              find "$GITHUB_WORKSPACE" -type f -name '*.ipa' -print
            } > /tmp/ios-package-diagnostic.log
            bash "$GITHUB_WORKSPACE/.github/scripts/annotate-build-failure.sh" \
              /tmp/ios-package-diagnostic.log 'locate unsigned iOS app'
            exit 1
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: zephyr_one/mobile/build/zephyr-one-ios-unsigned.ipa
          if-no-files-found: error
      - name: Upload IPA packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-packaging-diagnostics
          path: |
            /tmp/ios-package.log
            /tmp/ios-package-diagnostic.log
          if-no-files-found: warn

  release:
    # Publish a mobile pre-release only on an explicit dispatch with a version
    # (and not just validation), and only when every platform compiled and the
    # contract suite passed. iOS is a hard gate: "both platforms compile" is the
    # product contract, so a flaky macOS run must not silently ship a release.
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' && github.event.inputs.validation_only != 'true' && needs.contracts.result == 'success' && needs.android.result == 'success' && needs.ios.result == 'success' }}
    needs: [contracts, android, ios]
    runs-on: ubuntu-latest
    concurrency:
      group: zephyr-one-mobile-release-${{ github.event.inputs.version }}${{ github.event.inputs.prerelease_label }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: android-prerelease-apk
          path: release-artifacts/android
      - uses: actions/download-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: release-artifacts/ios
      - name: Pack release artifacts
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(release-artifacts/android/*.apk)
          ipas=(release-artifacts/ios/*.ipa)
          test "${#apks[@]}" -eq 1
          test "${#ipas[@]}" -eq 1
          unzip -tq "${apks[0]}"
          unzip -tq "${ipas[0]}"
          unzip -Z1 "${ipas[0]}" | grep -qx 'Payload/ZephyrOne.app/Info.plist'
          unzip -Z1 "${ipas[0]}" | grep -qx 'Payload/ZephyrOne.app/ZephyrOneMobileApp'
          mkdir -p dist-mobile
          install -m 0644 "${apks[0]}" dist-mobile/zephyr-one-android-prerelease.apk
          install -m 0644 "${ipas[0]}" dist-mobile/zephyr-one-ios-unsigned.ipa
          test "$(find dist-mobile -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
          test "$(find dist-mobile -maxdepth 1 -type f -name '*.ipa' | wc -l)" -eq 1
          ls -la dist-mobile
      - name: Replace target prerelease and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ github.event.inputs.version }}${{ github.event.inputs.prerelease_label }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            gh release delete "$TARGET_TAG" --cleanup-tag --yes
          elif git ls-remote --exit-code --tags origin "refs/tags/$TARGET_TAG" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TARGET_TAG"
          fi

      - name: Publish mobile release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}${{ github.event.inputs.prerelease_label }}
          target_commitish: ${{ github.sha }}
          name: "Zephyr One Mobile ${{ github.event.inputs.version }}${{ github.event.inputs.prerelease_label }}"
          body: |
            ## Zephyr One Mobile ${{ github.event.inputs.version }}${{ github.event.inputs.prerelease_label }}

            Native Zephyr One client (Kotlin + Jetpack Compose / Swift + SwiftUI) that syncs with
            Zephyr main. Sync is optional: the app is usable standalone on the device.

            ### This pre-release
            - Optimized Android pre-release APK (installs as-is and updates pre1+ in place)
            - Unsigned iOS 17+ IPA (requires signing before device installation)
            - Contracts suite + Android compile/test + iOS compile/test all green

            See the [Zephyr One unified contract](../../tree/main/FREEZE/zephyr%20one/ZEPHYR_ONE.md)
            for desktop, Android, iOS, startup, Link, shared-security and delivery scope.
          files: dist-mobile/*
          draft: false
          prerelease: true
          fail_on_unmatched_files: true

      - name: Validate release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ github.event.inputs.version }}${{ github.event.inputs.prerelease_label }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TARGET_TAG" --jq '.id')"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TARGET_TAG" --jq '.object.sha')"
          test "$tag_sha" = "$GITHUB_SHA"
          mapfile -t apk_names < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              --jq '.[] | select(.name | test("\\.apk$"; "i")) | .name'
          )
          mapfile -t ipa_names < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              --jq '.[] | select(.name | test("\\.ipa$"; "i")) | .name'
          )
          test "${#apk_names[@]}" -eq 1
          test "${apk_names[0]}" = 'zephyr-one-android-prerelease.apk'
          test "${#ipa_names[@]}" -eq 1
          test "${ipa_names[0]}" = 'zephyr-one-ios-unsigned.ipa'

name: Zephyr Link (Go)

on:
  push:
    branches: [main, zephyr-newui, zephyr-link-foundation-v1]
    paths:
      - 'zephyr-link/**'
      - 'link-v2-*.js'
      - 'agent-policy-engine.js'
      - 'webdav-writer-grade.js'
      - 'tests/link-v2-sync-envelope.test.mjs'
      - 'tests/agent-policy-engine.test.mjs'
      - 'tests/webdav-writer-grade.test.mjs'
      - 'tests/link-v2-sync-bridge.test.mjs'
      - 'scripts/gen-*-vectors.mjs'
      - 'docs/zephyr-link/**'
      - '.github/workflows/zephyr-link.yml'
  pull_request:
    branches: [main, zephyr-newui]
    paths:
      - 'zephyr-link/**'
      - 'link-v2-*.js'
      - 'agent-policy-engine.js'
      - 'webdav-writer-grade.js'
      - 'tests/link-v2-sync-envelope.test.mjs'
      - 'tests/agent-policy-engine.test.mjs'
      - 'tests/webdav-writer-grade.test.mjs'
      - 'tests/link-v2-sync-bridge.test.mjs'
      - 'scripts/gen-*-vectors.mjs'
      - 'docs/zephyr-link/**'
      - '.github/workflows/zephyr-link.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install schema validation dependencies
        run: npm ci --ignore-scripts
      - name: Verify Link specification and anti-bypass contracts
        run: |
          node docs/zephyr-link/verify-docs.mjs
          node docs/zephyr-link/conformance/run-conformance.mjs
          node docs/zephyr-link/conformance/verify-conformance.mjs
          node docs/zephyr-link/conformance/run-source-mutations.mjs
          node docs/zephyr-link/conformance/run-production-conformance.mjs
          node --test tests/link-v2-sync-envelope.test.mjs tests/agent-policy-engine.test.mjs tests/webdav-writer-grade.test.mjs tests/link-v2-sync-bridge.test.mjs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # ZSL/2 needs crypto/mlkem, which landed in the Go standard library in 1.24.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache-dependency-path: zephyr-link/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node deps (interop vectors come from the Node reference)
        run: npm ci --ignore-scripts

      - name: Vet and unit-test the Go core
        working-directory: zephyr-link
        run: |
          go vet ./...
          go test ./...

      - name: Install govulncheck for reachable vulnerability analysis
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Check Link vulnerabilities with the actual toolchain
        working-directory: zephyr-link
        run: govulncheck -mode=source -format=text ./...

      # The interop vectors are the contract that the Go and Node runtimes share a
      # wire format. Regenerate them from the Node reference and fail on any drift,
      # so neither side can silently change a label, table or encoding rule.
      - name: Verify Go<->Node interop vectors are current
        run: |
          node scripts/gen-zsl-vectors.mjs
          node scripts/gen-codec-vectors.mjs
          node scripts/gen-cdc-vectors.mjs
          if ! git diff --quiet -- zephyr-link/internal/*/testdata/; then
            echo "::error::interop vectors drifted from the Node reference; re-run scripts/gen-*-vectors.mjs and commit"
            git diff -- zephyr-link/internal/*/testdata/ | head -50
            exit 1
          fi

      # Build the Android-embeddable artifact to prove the mobile target compiles.
      - name: Cross-compile the Link core for Android arm64
        working-directory: zephyr-link
        run: |
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build ./...

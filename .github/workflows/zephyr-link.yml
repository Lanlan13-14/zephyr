name: Zephyr Link validation

on:
  push:
    branches: [main, zephyr-newui, zephyr-link-foundation-v1]
  pull_request:
    branches: [main, zephyr-newui, zephyr-link-foundation-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  baseline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: New behavioral tests must fail against the reviewed implementation
        run: |
          set -eu
          baseline="$RUNNER_TEMP/link-ac62b87d"
          git worktree add --detach "$baseline" ac62b87d4eea1eeed485b661854d6dceeb7e3e05
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline/node_modules"
          for file in ai-run-idempotency webdav-vault-restore-production agent-file-policy-gate; do
            cp "tests/$file.test.mjs" "$baseline/tests/$file.test.mjs"
          done
          node scripts/prove-link-regressions.mjs "$baseline"
          cp zephyr-cell/security/command_allowlist_test.go "$baseline/zephyr-cell/security/command_allowlist_test.go"
          if (cd "$baseline/zephyr-cell" && go test ./security -run TestCommandAllowlist_DeniesEntireShellString -count=1) > .link-evidence/baseline-cell.txt 2>&1; then
            echo 'Cell baseline incorrectly passed the new negative tests' >&2
            exit 1
          fi
          rg 'full shell string must be denied' .link-evidence/baseline-cell.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-baseline-regressions
          include-hidden-files: true
          path: .link-evidence/
          if-no-files-found: error

  specification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify specification and anti-bypass reference contracts
        run: |
          node docs/zephyr-link/verify-docs.mjs
          node docs/zephyr-link/conformance/run-conformance.mjs
          node docs/zephyr-link/conformance/verify-conformance.mjs
          node docs/zephyr-link/conformance/run-source-mutations.mjs

  product-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [sync, webdav, agent, ai]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Product regression tests (not reference-only)
        env:
          LINK_TEST_GROUP: ${{ matrix.group }}
        run: node scripts/run-link-product-tests.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-node-${{ matrix.group }}
          include-hidden-files: true
          path: .link-evidence/
          if-no-files-found: error

  primary-pty-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Actual browser renderer and real retained SSH PTY handoff
        run: node --test tests/link-pty-browser-live.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-primary-pty-browser
          include-hidden-files: true
          path: .link-evidence/
          if-no-files-found: warn

  go-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        module: [zephyr-link, zephyr-cell, zephyr-ai]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Vet and run actual Go product module
        env:
          CGO_ENABLED: '0'
        working-directory: ${{ matrix.module }}
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Source vulnerability analysis
        env:
          CGO_ENABLED: '0'
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -mode=source -format=text ./...
      - name: Verify Go and Node interop vectors
        if: matrix.module == 'zephyr-link'
        run: |
          node scripts/gen-zsl-vectors.mjs
          node scripts/gen-codec-vectors.mjs
          node scripts/gen-cdc-vectors.mjs
          git diff --exit-code -- zephyr-link/internal/
      - name: Cross-compile Android source
        if: matrix.module != 'zephyr-cell'
        working-directory: ${{ matrix.module }}
        run: CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build ./...

  agent-filesystem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: zephyr_agent
      - name: Analyze actual file provider and run filesystem tests
        working-directory: zephyr_agent
        run: |
          dart analyze lib/fs/file_provider.dart test/file_provider_test.dart
          flutter test test/file_provider_test.dart

  production-release-gate:
    # Intentionally independent of passing unit/reference jobs. Unsupported
    # required vectors are a release blocker, never an allowed-failure result.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Require complete production conformance
        run: |
          mkdir -p .link-evidence
          node docs/zephyr-link/conformance/run-production-conformance.mjs > .link-evidence/production-conformance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-production-release-gate
          include-hidden-files: true
          path: .link-evidence/
          if-no-files-found: error

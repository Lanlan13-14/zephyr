name: Zephyr Cell (Go)

on:
  push:
    branches: [main]
    paths:
      - 'zephyr-cell/**'
      - '.github/workflows/zephyr-cell.yml'
  pull_request:
    paths:
      - 'zephyr-cell/**'
      - '.github/workflows/zephyr-cell.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: zephyr-cell/go.sum

      - name: Vet
        working-directory: zephyr-cell
        run: go vet ./...

      - name: Test
        working-directory: zephyr-cell
        run: go test ./... -v -count=1

name: Zephyr Agent Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'agent-v1.0.0'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: zephyr_agent

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: zephyr_agent/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: zephyr_agent/build/app/outputs/bundle/release/app-release.aab

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Archive Windows build
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "zephyr-agent-windows-x64.zip"

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: zephyr_agent/zephyr-agent-windows-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Archive Linux build
        run: tar czf zephyr-agent-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: zephyr_agent/zephyr-agent-linux-x64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Archive macOS build
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$OLDPWD/zephyr-agent-macos-universal.zip" "zephyr_agent.app"

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: zephyr_agent/zephyr-agent-macos-universal.zip

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Archive iOS build
        run: |
          cd build/ios/iphoneos
          zip -r "$OLDPWD/zephyr-agent-ios-unsigned.zip" "Runner.app"

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: zephyr_agent/zephyr-agent-ios-unsigned.zip

  release:
    needs: [build-android, build-windows, build-linux, build-macos, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Rename artifacts
        run: |
          cd ../release-artifacts
          VERSION=${{ github.event.inputs.tag }}
          # APK
          cp android-apk/app-release.apk "zephyr-agent-android-arm64-${VERSION}.apk" || true
          # AAB
          cp android-aab/app-release.aab "zephyr-agent-android-${VERSION}.aab" || true
          # Windows
          cp windows-x64/zephyr-agent-windows-x64.zip "zephyr-agent-windows-x64-${VERSION}.zip" || true
          # Linux
          cp linux-x64/zephyr-agent-linux-x64.tar.gz "zephyr-agent-linux-x64-${VERSION}.tar.gz" || true
          # macOS
          cp macos-universal/zephyr-agent-macos-universal.zip "zephyr-agent-macos-universal-${VERSION}.zip" || true
          # iOS
          cp ios-unsigned/zephyr-agent-ios-unsigned.zip "zephyr-agent-ios-${VERSION}-unsigned.zip" || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "Zephyr Agent ${{ github.event.inputs.tag }}"
          body: |
            ## Zephyr Agent ${{ github.event.inputs.tag }}

            Cross-platform file sharing agent for Zephyr RDP drive redirection.

            ### Downloads
            - **Android APK**: `zephyr-agent-android-arm64-${{ github.event.inputs.tag }}.apk`
            - **Android AAB**: `zephyr-agent-android-${{ github.event.inputs.tag }}.aab`
            - **Windows**: `zephyr-agent-windows-x64-${{ github.event.inputs.tag }}.zip`
            - **Linux**: `zephyr-agent-linux-x64-${{ github.event.inputs.tag }}.tar.gz`
            - **macOS**: `zephyr-agent-macos-universal-${{ github.event.inputs.tag }}.zip`
            - **iOS (unsigned)**: `zephyr-agent-ios-${{ github.event.inputs.tag }}-unsigned.zip`
          draft: false
          prerelease: false
          files: |
            release-artifacts/zephyr-agent-*

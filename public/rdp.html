<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content">
    <title data-i18n="Zephyr - 远程桌面">Zephyr - 远程桌面</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌬️</text></svg>">
    <link rel="stylesheet" href="style.css?v=20260726-motion-login1">
    <link rel="modulepreload" href="i18n/runtime.js?v=20260726-motion-login1">
</head>
<body>
    <div class="novnc-page rdp-page">
        <div class="terminal-topbar rdp-topbar novnc-topbar">
            <div class="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText" data-i18n="连接中...">连接中...</span>
            </div>
            <span class="info" id="connInfo"></span>
            <div class="topbar-actions novnc-toolbar">
                <button class="btn-sm" id="qualityBtn" data-rdp-icon="quality" title="切换性能/画质模式" data-i18n-title="切换性能/画质模式" data-i18n="平衡">平衡</button>
                <button class="btn-sm" id="resolutionBtn" data-rdp-icon="quality" title="切换远程桌面分辨率：自动 / 1080p / 2K / 4K" data-i18n-title="切换远程桌面分辨率：自动 / 1080p / 2K / 4K" data-i18n="自动">自动</button>
                <button class="btn-sm" id="fpsBtn" data-rdp-icon="quality" title="切换远程桌面帧率：30 / 45 / 60 / 120 / 144 FPS" data-i18n-title="切换远程桌面帧率：30 / 45 / 60 / 120 / 144 FPS">30FPS</button>
                <button class="btn-sm" id="fitBtn" data-rdp-icon="fit" title="适应窗口" data-i18n-title="适应窗口" data-i18n="适应">适应</button>
                <button class="btn-sm zoom-control" id="zoomBtn" data-rdp-icon="zoom" title="拖动无极缩放远程画面" data-i18n-title="拖动无极缩放远程画面"><input id="zoomSlider" type="range" min="50" max="250" step="1" value="100" aria-label="远程画面无极缩放" data-i18n-aria-label="远程画面无极缩放"><em id="zoomValue">100%</em></button>
                <button class="btn-sm" id="clipboardBtn" data-rdp-icon="clipboard" title="打开跨设备剪贴板面板" data-i18n-title="打开跨设备剪贴板面板" data-i18n="剪贴板">剪贴板</button>
                <button class="btn-sm" id="rdpFilesBtn" data-rdp-icon="file" title="打开 RDP 文件剪贴板/下载面板" data-i18n-title="打开 RDP 文件剪贴板/下载面板" data-i18n="文件">文件</button>
                <button class="btn-sm" id="keyboardBtn" data-rdp-icon="keyboard" title="打开/关闭手机软键盘" data-i18n-title="打开/关闭手机软键盘" aria-pressed="false" data-i18n="键盘">键盘</button>
                <button class="btn-sm" id="shortcutsBtn" data-rdp-icon="shortcuts" title="打开常用快捷键" data-i18n-title="打开常用快捷键" data-i18n="快捷键">快捷键</button>
                <button class="btn-sm force-hidden" id="notesBtn" title="笔记" data-i18n-title="笔记" aria-label="笔记" data-i18n-aria-label="笔记" data-i18n="笔记">笔记</button>
                <button class="btn-sm" id="joystickBtn" data-rdp-icon="joystick" aria-label="视区" data-i18n-aria-label="视区" data-i18n="视区">视区</button>
                <button class="btn-sm" id="ctrlAltDelBtn" data-rdp-icon="security" title="发送 Ctrl+Alt+Del" data-i18n-title="发送 Ctrl+Alt+Del">Ctrl+Alt+Del</button>
                <button class="btn-sm" id="reconnectBtn" data-rdp-icon="reconnect" title="重新连接" data-i18n-title="重新连接" data-i18n="重连">重连</button>
                <button class="btn-sm danger" id="disconnectBtn" data-rdp-icon="disconnect" title="断开连接" data-i18n-title="断开连接" data-i18n="断开">断开</button>
            </div>
        </div>
        <div class="rdp-stage novnc-stage" id="rdpStage" tabindex="0">
            <textarea id="mobileKeyboardInput" class="rdp-mobile-keyboard-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text" enterkeyhint="enter" lang="" aria-label="远程桌面软键盘输入" data-i18n-aria-label="远程桌面软键盘输入"></textarea>
            <!-- debug HUD removed -->

            <div class="rdp-floating-panel clipboard-panel" id="clipboardPanel" hidden>
                <div class="panel-drag-handle" data-drag-panel="clipboardPanel" title="拖动移动窗口" data-i18n-title="拖动移动窗口">
                    <button class="panel-traffic-btn" data-layout-panel="clipboardPanel" title="窗口布局" data-i18n-title="窗口布局"><span></span></button>
                </div>
                <div class="rdp-panel-content">
                    <div class="rdp-panel-head panel-titlebar">
                        <strong data-i18n="跨设备剪贴板">跨设备剪贴板</strong>
                    </div>
                    <label class="rdp-panel-label" for="clipboardText" data-i18n="本机 → 远程">本机 → 远程</label>
                    <textarea id="clipboardText" class="rdp-panel-textarea" placeholder="输入或粘贴要发送到远程桌面的文本" data-i18n-placeholder="输入或粘贴要发送到远程桌面的文本"></textarea>
                    <div class="rdp-panel-actions">
                        <button class="btn-sm" id="clipboardReadLocalBtn" data-i18n="读取本机">读取本机</button>
                        <button class="btn-sm active" id="clipboardSendBtn" data-i18n="发送到远程">发送到远程</button>
                    </div>
                    <label class="rdp-panel-label" for="remoteClipboardText" data-i18n="远程 → 本机">远程 → 本机</label>
                    <textarea id="remoteClipboardText" class="rdp-panel-textarea" readonly placeholder="远程复制文本后会显示在这里" data-i18n-placeholder="远程复制文本后会显示在这里"></textarea>
                    <div class="rdp-panel-actions">
                        <button class="btn-sm" id="clipboardCopyRemoteBtn" data-i18n="复制到本机">复制到本机</button>
                        <span class="rdp-panel-hint" id="clipboardHint" data-i18n="等待远程剪贴板...">等待远程剪贴板...</span>
                    </div>
                </div>
                <div class="panel-resize-handle left" data-resize-panel="clipboardPanel" data-resize-edge="left" title="拖动调整大小" data-i18n-title="拖动调整大小"></div>
                <div class="panel-resize-handle right" data-resize-panel="clipboardPanel" data-resize-edge="right" title="拖动调整大小" data-i18n-title="拖动调整大小"></div>
            </div>

            <div class="rdp-floating-panel files-panel" id="filesPanel" hidden>
                <div class="panel-drag-handle" data-drag-panel="filesPanel" title="拖动移动窗口" data-i18n-title="拖动移动窗口">
                    <button class="panel-traffic-btn" data-layout-panel="filesPanel" title="窗口布局" data-i18n-title="窗口布局"><span></span></button>
                </div>
                <div class="rdp-panel-content">
                    <div class="rdp-panel-head panel-titlebar">
                        <strong data-i18n="远程文件剪贴板">远程文件剪贴板</strong>
                    </div>
                    <label class="rdp-panel-label" data-i18n="从 Windows 复制的文件">从 Windows 复制的文件</label>
                    <div class="rdp-remote-file-list" id="rdpRemoteFileList">
                        <div class="rdp-file-empty" data-i18n="远程剪贴板暂无文件">远程剪贴板暂无文件</div>
                    </div>
                    <div class="rdp-panel-actions">
                        <button class="btn-sm" id="rdpFilePasteToRemoteBtn" data-i18n="粘贴到远程">粘贴到远程</button>
                        <button class="btn-sm" id="rdpFileDownloadAllBtn" data-i18n="全部下载到本机">全部下载到本机</button>
                    </div>
                    <label class="rdp-panel-label" data-i18n="发送到 Windows">发送到 Windows</label>
                    <div class="rdp-remote-file-list" id="rdpPendingFileList">
                        <div class="rdp-file-empty" data-i18n="暂无待粘贴文件">暂无待粘贴文件</div>
                    </div>
                    <div class="rdp-panel-actions">
                        <button class="btn-sm active" id="rdpFileSelectBtn" data-i18n="上传文件">上传文件</button>
                        <button class="btn-sm" id="rdpPendingPasteBtn" data-i18n="粘贴到远程">粘贴到远程</button>
                        <input type="file" id="rdpFileInput" multiple hidden>
                    </div>
                    <span class="rdp-panel-hint" id="filesHint" data-i18n="点击“上传文件”只会加入待粘贴列表；真正粘贴时才上传到主端">点击“上传文件”只会加入待粘贴列表；真正粘贴时才上传到主端</span>
                </div>
                <div class="panel-resize-handle left" data-resize-panel="filesPanel" data-resize-edge="left" title="拖动调整大小" data-i18n-title="拖动调整大小"></div>
                <div class="panel-resize-handle right" data-resize-panel="filesPanel" data-resize-edge="right" title="拖动调整大小" data-i18n-title="拖动调整大小"></div>
            </div>

            <div class="rdp-floating-panel shortcuts-panel" id="shortcutsPanel" hidden>
                <div class="panel-drag-handle" data-drag-panel="shortcutsPanel" title="拖动移动窗口" data-i18n-title="拖动移动窗口">
                    <button class="panel-traffic-btn" data-layout-panel="shortcutsPanel" title="窗口布局" data-i18n-title="窗口布局"><span></span></button>
                </div>
                <div class="rdp-panel-content">
                    <div class="rdp-panel-head panel-titlebar">
                        <strong data-i18n="快捷键 / 手机辅助">快捷键 / 手机辅助</strong>
                    </div>
                    <div class="rdp-shortcut-grid" id="shortcutGrid">
                        <button class="tool-btn" data-keyseq="esc">Esc</button>
                        <button class="tool-btn" data-keyseq="tab">Tab</button>
                        <button class="tool-btn" data-keyseq="enter">Enter</button>
                        <button class="tool-btn" data-keyseq="backspace">Backspace</button>
                        <button class="tool-btn" data-keyseq="win">Win</button>
                        <button class="tool-btn" data-keyseq="alt-tab">Alt+Tab</button>
                        <button class="tool-btn" data-keyseq="ctrl-a">Ctrl+A</button>
                        <button class="tool-btn" data-keyseq="ctrl-b">Ctrl+B</button>
                        <button class="tool-btn" data-keyseq="ctrl-c">Ctrl+C</button>
                        <button class="tool-btn" data-keyseq="ctrl-d">Ctrl+D</button>
                        <button class="tool-btn" data-keyseq="ctrl-e">Ctrl+E</button>
                        <button class="tool-btn" data-keyseq="ctrl-f">Ctrl+F</button>
                        <button class="tool-btn" data-keyseq="ctrl-g">Ctrl+G</button>
                        <button class="tool-btn" data-keyseq="ctrl-h">Ctrl+H</button>
                        <button class="tool-btn" data-keyseq="ctrl-i">Ctrl+I</button>
                        <button class="tool-btn" data-keyseq="ctrl-j">Ctrl+J</button>
                        <button class="tool-btn" data-keyseq="ctrl-k">Ctrl+K</button>
                        <button class="tool-btn" data-keyseq="ctrl-l">Ctrl+L</button>
                        <button class="tool-btn" data-keyseq="ctrl-m">Ctrl+M</button>
                        <button class="tool-btn" data-keyseq="ctrl-n">Ctrl+N</button>
                        <button class="tool-btn" data-keyseq="ctrl-o">Ctrl+O</button>
                        <button class="tool-btn" data-keyseq="ctrl-p">Ctrl+P</button>
                        <button class="tool-btn" data-keyseq="ctrl-q">Ctrl+Q</button>
                        <button class="tool-btn" data-keyseq="ctrl-r">Ctrl+R</button>
                        <button class="tool-btn" data-keyseq="ctrl-s">Ctrl+S</button>
                        <button class="tool-btn" data-keyseq="ctrl-t">Ctrl+T</button>
                        <button class="tool-btn" data-keyseq="ctrl-u">Ctrl+U</button>
                        <button class="tool-btn" data-keyseq="ctrl-v">Ctrl+V</button>
                        <button class="tool-btn" data-keyseq="ctrl-w">Ctrl+W</button>
                        <button class="tool-btn" data-keyseq="ctrl-x">Ctrl+X</button>
                        <button class="tool-btn" data-keyseq="ctrl-y">Ctrl+Y</button>
                        <button class="tool-btn" data-keyseq="ctrl-z">Ctrl+Z</button>
                        <button class="tool-btn" data-keyseq="up">↑</button>
                        <button class="tool-btn" data-keyseq="down">↓</button>
                        <button class="tool-btn" data-keyseq="left">←</button>
                        <button class="tool-btn" data-keyseq="right">→</button>
                        <button class="tool-btn" data-keyseq="home">Home</button>
                        <button class="tool-btn" data-keyseq="end">End</button>
                        <button class="tool-btn" data-keyseq="pageup">PgUp</button>
                        <button class="tool-btn" data-keyseq="pagedown">PgDn</button>
                        <button class="tool-btn" data-keyseq="f1">F1</button>
                        <button class="tool-btn" data-keyseq="f2">F2</button>
                        <button class="tool-btn" data-keyseq="f3">F3</button>
                        <button class="tool-btn" data-keyseq="f4">F4</button>
                        <button class="tool-btn" data-keyseq="f5">F5</button>
                        <button class="tool-btn" data-keyseq="f6">F6</button>
                        <button class="tool-btn" data-keyseq="f7">F7</button>
                        <button class="tool-btn" data-keyseq="f8">F8</button>
                        <button class="tool-btn" data-keyseq="f9">F9</button>
                        <button class="tool-btn" data-keyseq="f10">F10</button>
                        <button class="tool-btn" data-keyseq="f11">F11</button>
                        <button class="tool-btn" data-keyseq="f12">F12</button>
                    </div>
                    <div class="rdp-panel-hint" data-i18n="提示：单指点远程桌面会发送鼠标左键点击；点“⌨ 键盘”可唤起手机输入法。">提示：单指点远程桌面会发送鼠标左键点击；点“⌨ 键盘”可唤起手机输入法。</div>
                </div>
                <div class="panel-resize-handle left" data-resize-panel="shortcutsPanel" data-resize-edge="left" title="拖动调整大小" data-i18n-title="拖动调整大小"></div>
                <div class="panel-resize-handle right" data-resize-panel="shortcutsPanel" data-resize-edge="right" title="拖动调整大小" data-i18n-title="拖动调整大小"></div>
            </div>

            <div class="rdp-floating-panel joystick-panel" id="joystickPanel" hidden>
                <div class="panel-drag-handle" data-drag-panel="joystickPanel">
                    <button class="panel-traffic-btn" data-layout-panel="joystickPanel" aria-label="窗口布局" data-i18n-aria-label="窗口布局"><span></span></button>
                </div>
                <div class="rdp-panel-content joystick-panel-content">
                    <div class="rdp-joystick" id="joystickContainer">
                        <div class="rdp-joystick-around">
                            <div class="rdp-joystick-handle">
                                <div class="rdp-joystick-knob" id="joystickKnob">
                                    <div class="rdp-joystick-inside">
                                        <div class="rdp-joystick-dot"></div>
                                        <div class="rdp-joystick-dot"></div>
                                        <div class="rdp-joystick-dot"></div>
                                        <div class="rdp-joystick-dot"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <svg class="rdp-joystick-icon" data-joydir="up" role="button" tabindex="0" aria-label="视区上移" data-i18n-aria-label="视区上移" viewBox="0 0 1024 1024" focusable="false"><path d="M512 330.666667c14.933333 0 29.866667 4.266667 40.533333 14.933333l277.33333399 234.666667c27.733333 23.466667 29.866667 64 8.53333301 89.6-23.466667 27.733333-64 29.866667-89.6 8.53333299L512 477.866667l-236.8 200.53333299c-27.733333 23.466667-68.266667 19.19999999-89.6-8.53333299-23.466667-27.733333-19.19999999-68.266667 8.53333301-89.6l277.33333399-234.666667c10.666667-10.666667 25.6-14.933333 40.533333-14.933333z"/></svg>
                        <svg class="rdp-joystick-icon" data-joydir="right" role="button" tabindex="0" aria-label="视区右移" data-i18n-aria-label="视区右移" viewBox="0 0 200 200" focusable="false"><path d="M135.417 100C135.417 102.917 134.583 105.833 132.5 107.917L86.6667 162.083C82.0833 167.5 74.1667 167.917 69.1667 163.75C63.75 159.167 63.3333 151.25 67.5 146.25L106.667 100L67.5 53.75C62.9167 48.3333 63.75 40.4167 69.1667 36.25C74.5833 31.6667 82.5 32.5 86.6667 37.9167L132.5 92.0833C134.583 94.1667 135.417 97.0833 135.417 100Z"/></svg>
                        <svg class="rdp-joystick-icon" data-joydir="down" role="button" tabindex="0" aria-label="视区下移" data-i18n-aria-label="视区下移" viewBox="0 0 200 200" focusable="false"><path d="M100 135.417C97.0833 135.417 94.1667 134.583 92.0833 132.5L37.9167 86.6667C32.5 82.0833 32.0833 74.1667 36.25 69.1667C40.8333 63.75 48.75 63.3333 53.75 67.5L100 106.667L146.25 67.5C151.667 62.9167 159.583 63.75 163.75 69.1667C168.333 74.5833 167.5 82.5 162.083 86.6667L107.917 132.5C105.833 134.583 102.917 135.417 100 135.417Z"/></svg>
                        <svg class="rdp-joystick-icon" data-joydir="left" role="button" tabindex="0" aria-label="视区左移" data-i18n-aria-label="视区左移" viewBox="0 0 200 200" focusable="false"><path d="M64.5833 100C64.5833 97.0833 65.4167 94.1667 67.5 92.0833L113.333 37.9167C117.917 32.5 125.833 32.0833 130.833 36.25C136.25 40.8333 136.667 48.75 132.5 53.75L93.3333 100L132.5 146.25C137.083 151.667 136.25 159.583 130.833 163.75C125.417 168.333 117.5 167.5 113.333 162.083L67.5 107.917C65.4167 105.833 64.5833 102.917 64.5833 100Z"/></svg>
                    </div>
                </div>
                <div class="panel-resize-handle left" data-resize-panel="joystickPanel" data-resize-edge="left"></div>
                <div class="panel-resize-handle right" data-resize-panel="joystickPanel" data-resize-edge="right"></div>
            </div>

            <div class="terminal-overlay" id="rdpOverlay">
                <div class="spinner"></div>
                <span class="msg" id="overlayMsg" data-i18n="正在建立 RDP 连接...">正在建立 RDP 连接...</span>
            </div>

            <!-- Certificate verification dialog -->
            <div class="rdp-cert-dialog-backdrop" id="rdpCertDialog">
                <div class="rdp-cert-dialog">
                    <h2 data-i18n="无法验证证书。是否仍要连接？">无法验证证书。是否仍要连接？</h2>
                    <p class="rdp-cert-field"><span data-i18n="你将连接到：">你将连接到：</span><br><strong id="certHost"></strong></p>
                    <p class="rdp-cert-field"><span data-i18n="来自远程电脑的证书中的名称：">来自远程电脑的证书中的名称：</span><br><strong id="certSubject"></strong></p>
                    <p class="rdp-cert-reasons-label" data-i18n="由于以下原因，连接到这台电脑可能不安全：">由于以下原因，连接到这台电脑可能不安全：</p>
                    <ul class="rdp-cert-reasons" id="certReasons"></ul>
                    <div class="rdp-cert-remember">
                        <label><input type="checkbox" id="certRemember"> <span data-i18n="忽略提示">忽略提示</span></label>
                    </div>
                    <div class="rdp-cert-actions" id="rdpCertActions">
                        <button class="rdp-cert-btn rdp-cert-btn-cancel" id="certCancelBtn" data-i18n="取消">取消</button>
                        <button class="rdp-cert-btn rdp-cert-btn-connect" id="certConnectBtn" data-i18n="连接">连接</button>
                    </div>
                </div>
            </div>
            <div class="rdp-display-shell novnc-screen-shell" id="displayShell">
                <div class="rdp-display novnc-screen" id="display"></div>
            </div>
        </div>
    </div>
    <script src="rdp-wasm-client.js?v=20260726-motion-login1" type="module"></script>
    <script>
    /* Auto-report H264 debug logs to server after 8 seconds */
    setTimeout(async () => {
        try {
            if (typeof window._h264Logs !== 'function') return;
            const logs = window._h264Logs();
            await fetch('/api/rdp/h264-debug', { method: 'POST', headers: {'Content-Type':'application/json'}, body: logs });
        } catch {}
    }, 8000);
    </script>
</body>
</html>

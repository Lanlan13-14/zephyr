<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <title data-i18n="恢复之前的密码 · Zephyr">恢复之前的密码 · Zephyr</title>
    <link rel="stylesheet" href="/style.css?v=20260727-ai-confirm-fix1">
    <link rel="modulepreload" href="/i18n/runtime.js?v=20260727-ai-confirm-fix1">
    <style>
        /* Standalone password-rollback landing page (reachable while logged
         * out). Reuses the same design tokens as /open. */
        .rollback-shell {
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
        }
        .rollback-card {
            width: min(440px, 100%);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lift);
            padding: 28px 24px 22px;
        }
        .rollback-eyebrow {
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .rollback-title {
            margin: 0 0 8px;
            font-size: 20px;
        }
        .rollback-sub {
            margin: 0 0 16px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }
        .rollback-warning {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            border: 1px solid color-mix(in srgb, #e5a50a 45%, transparent);
            background: color-mix(in srgb, #e5a50a 12%, transparent);
            border-radius: var(--radius-control, 10px);
            padding: 10px 12px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        .rollback-error {
            display: none;
            border: 1px solid color-mix(in srgb, #d33 45%, transparent);
            background: color-mix(in srgb, #d33 12%, transparent);
            border-radius: var(--radius-control, 10px);
            padding: 10px 12px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        .rollback-error.show { display: block; }
        .rollback-success {
            display: none;
            border: 1px solid color-mix(in srgb, #2ba84a 45%, transparent);
            background: color-mix(in srgb, #2ba84a 12%, transparent);
            border-radius: var(--radius-control, 10px);
            padding: 10px 12px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        .rollback-success.show { display: block; }
        .rollback-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .rollback-actions .btn { min-height: 40px; }
        /* Same neutral surface look as the login page's 返回登录 (.auth-link a),
         * not the accent/purple default .btn. */
        .rollback-actions .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 0 16px;
            border-radius: var(--radius-control, 10px);
            border: 1px solid color-mix(in srgb, var(--text-secondary) 10%, transparent);
            background: color-mix(in srgb, var(--surface) 72%, var(--bg));
            color: var(--text);
            text-decoration: none;
            font: inherit;
            cursor: pointer;
        }
        .rollback-actions .btn-back:hover {
            border-color: color-mix(in srgb, var(--text-secondary) 18%, transparent);
            background: color-mix(in srgb, var(--surface) 58%, var(--bg));
        }
    </style>
</head>
<body>
    <main class="rollback-shell">
        <section class="rollback-card" id="rollbackCard" aria-live="polite">
            <div class="rollback-eyebrow">Zephyr Security</div>
            <h1 class="rollback-title" data-i18n="恢复之前的密码">恢复之前的密码</h1>
            <p class="rollback-sub" data-i18n="此链接用于在密码被非本人修改后，将账号恢复到修改前的密码。">此链接用于在密码被非本人修改后，将账号恢复到修改前的密码。</p>

            <div class="rollback-warning" id="rollbackWarning">
                <span aria-hidden="true">⚠️</span>
                <div>
                    <strong data-i18n="仅当本次密码修改不是您本人操作时，才应点击恢复。">仅当本次密码修改不是您本人操作时，才应点击恢复。</strong>
                    <div data-i18n="恢复后所有设备上的会话都会退出，请使用之前的密码重新登录。">恢复后所有设备上的会话都会退出，请使用之前的密码重新登录。</div>
                </div>
            </div>

            <div class="rollback-error" id="rollbackError" role="alert"></div>
            <div class="rollback-success" id="rollbackSuccess"></div>

            <div class="rollback-actions" id="rollbackActions">
                <a class="btn-back" href="/" data-i18n="返回登录">返回登录</a>
                <button type="button" class="btn btn-primary" id="rollbackConfirmBtn" data-i18n="恢复密码">恢复密码</button>
            </div>
        </section>
    </main>
    <script src="/password-rollback.js?v=20260727-ai-confirm-fix1" type="module"></script>
</body>
</html>
